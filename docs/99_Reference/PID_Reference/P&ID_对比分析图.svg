<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1525;stop-opacity:1" />
    </linearGradient>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 18px; fill: #ffffff; font-weight: bold; }
      .subtitle { font-family: Arial, sans-serif; font-size: 12px; fill: #aaaaaa; }
      .section-title { font-family: Arial, sans-serif; font-size: 13px; fill: #ffffff; font-weight: bold; }
      .our-label { font-family: Arial, sans-serif; font-size: 11px; fill: #ff6b6b; font-weight: bold; }
      .std-label { font-family: Arial, sans-serif; font-size: 11px; fill: #4fc3f7; font-weight: bold; }
      .desc { font-family: Arial, sans-serif; font-size: 9px; fill: #aaaaaa; }
      .arrow { font-family: Arial, sans-serif; font-size: 20px; fill: #ffd700; }
      .rating { font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <text x="600" y="30" class="title" text-anchor="middle">我们的流程图 vs 专业P&amp;ID标准 对比分析</text>
  <text x="600" y="50" class="subtitle" text-anchor="middle">Our Flowsheet vs Professional P&amp;ID Standards Comparison</text>

  <!-- Row 1: Tank Symbol -->
  <g transform="translate(50, 80)">
    <text x="0" y="0" class="section-title">储罐/容器 Tank/Vessel</text>

    <!-- Our Version -->
    <g transform="translate(0, 20)">
      <text x="100" y="0" class="our-label">我们的版本</text>
      <rect x="50" y="20" width="100" height="80" rx="5" fill="#2a3d50" stroke="#4fc3f7" stroke-width="2"/>
      <rect x="55" y="50" width="90" height="45" rx="0" fill="#00aaff" opacity="0.5"/>
      <text x="100" y="60" font-size="8" fill="#ffffff" text-anchor="middle">WT-101</text>
      <text x="100" y="130" class="desc" text-anchor="middle">渐变填充+阴影</text>
      <text x="100" y="145" class="desc" text-anchor="middle">Gradient + Shadow</text>
    </g>

    <!-- Arrow -->
    <text x="200" y="80" class="arrow" text-anchor="middle">→</text>

    <!-- Standard Version -->
    <g transform="translate(250, 20)">
      <text x="100" y="0" class="std-label">专业标准</text>
      <rect x="50" y="20" width="100" height="80" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="100" cy="20" rx="50" ry="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <ellipse cx="100" cy="100" rx="50" ry="12" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="100" y="65" font-size="10" fill="#ffd700" text-anchor="middle" font-weight="bold">TK-101</text>
      <text x="100" y="130" class="desc" text-anchor="middle">标准矩形轮廓+椭圆封头</text>
      <text x="100" y="145" class="desc" text-anchor="middle">Standard Outline + Ellipse Caps</text>
    </g>

    <!-- Rating -->
    <text x="550" y="80" class="rating" fill="#ffa726">★★★☆☆</text>
    <text x="550" y="100" class="desc">视觉好但符号不标准</text>
  </g>

  <!-- Row 2: Pump Symbol -->
  <g transform="translate(50, 260)">
    <text x="0" y="0" class="section-title">泵 Pump</text>

    <!-- Our Version -->
    <g transform="translate(0, 20)">
      <text x="100" y="0" class="our-label">我们的版本</text>
      <rect x="60" y="30" width="80" height="60" rx="3" fill="#2a3d50" stroke="#66BB6A" stroke-width="2"/>
      <text x="100" y="65" font-size="12" fill="#66BB6A" text-anchor="middle" font-weight="bold">P</text>
      <text x="100" y="120" class="desc" text-anchor="middle">矩形+"P"标注</text>
      <text x="100" y="135" class="desc" text-anchor="middle">Rectangle + "P" Label</text>
    </g>

    <!-- Arrow -->
    <text x="200" y="80" class="arrow" text-anchor="middle">→</text>

    <!-- Standard Version -->
    <g transform="translate(250, 20)">
      <text x="100" y="0" class="std-label">专业标准</text>
      <circle cx="100" cy="65" r="35" fill="none" stroke="#66BB6A" stroke-width="2"/>
      <path d="M 100 40 L 115 65 L 100 90 L 85 65 Z" fill="none" stroke="#66BB6A" stroke-width="1.5"/>
      <text x="100" y="140" class="desc" text-anchor="middle">圆形+三角形叶轮</text>
      <text x="100" y="155" class="desc" text-anchor="middle">Circle + Triangle Impeller</text>
    </g>

    <!-- Rating -->
    <text x="550" y="80" class="rating" fill="#ff6b6b">★★☆☆☆</text>
    <text x="550" y="100" class="desc">符号不标准，缺乏辨识度</text>
  </g>

  <!-- Row 3: Temperature Instrument -->
  <g transform="translate(50, 440)">
    <text x="0" y="0" class="section-title">温度仪表 Temperature Instrument</text>

    <!-- Our Version -->
    <g transform="translate(0, 20)">
      <text x="100" y="0" class="our-label">我们的版本</text>
      <rect x="50" y="30" width="100" height="50" rx="3" fill="#2a3d50" stroke="#f0ad4e" stroke-width="1.5"/>
      <text x="100" y="60" font-size="10" fill="#00ff00" text-anchor="middle">TT: 95°C</text>
      <text x="100" y="110" class="desc" text-anchor="middle">纯文本标注</text>
      <text x="100" y="125" class="desc" text-anchor="middle">Text Only Label</text>
    </g>

    <!-- Arrow -->
    <text x="200" y="70" class="arrow" text-anchor="middle">→</text>

    <!-- Standard Version -->
    <g transform="translate(250, 20)">
      <text x="100" y="0" class="std-label">专业标准</text>
      <circle cx="100" cy="60" r="25" fill="none" stroke="#f0ad4e" stroke-width="2"/>
      <line x1="100" y1="35" x2="100" y2="25" stroke="#f0ad4e" stroke-width="1"/>
      <text x="100" y="58" font-size="10" fill="#f0ad4e" text-anchor="middle" font-weight="bold">TT</text>
      <text x="100" y="72" font-size="8" fill="#f0ad4e" text-anchor="middle">101</text>
      <text x="100" y="110" class="desc" text-anchor="middle">圆形+ISA代码</text>
      <text x="100" y="125" class="desc" text-anchor="middle">Circle + ISA Code</text>
    </g>

    <!-- Rating -->
    <text x="550" y="70" class="rating" fill="#ff6b6b">★☆☆☆☆</text>
    <text x="550" y="90" class="desc">缺少标准仪表符号</text>
  </g>

  <!-- Row 4: Heat Exchanger -->
  <g transform="translate(50, 610)">
    <text x="0" y="0" class="section-title">热交换器 Heat Exchanger</text>

    <!-- Our Version -->
    <g transform="translate(0, 20)">
      <text x="100" y="0" class="our-label">我们的版本</text>
      <rect x="40" y="25" width="120" height="60" rx="3" fill="#2a3d50" stroke="#ff6b6b" stroke-width="2"/>
      <path d="M 50 40 Q 70 50 90 40 Q 110 50 130 40 Q 110 60 90 50 Q 70 60 50 50" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
      <text x="100" y="105" class="desc" text-anchor="middle">波浪线表示换热管</text>
      <text x="100" y="120" class="desc" text-anchor="middle">Wave Lines for Tubes</text>
    </g>

    <!-- Arrow -->
    <text x="200" y="70" class="arrow" text-anchor="middle">→</text>

    <!-- Standard Version -->
    <g transform="translate(250, 20)">
      <text x="100" y="0" class="std-label">专业标准</text>
      <rect x="40" y="25" width="120" height="60" rx="2" fill="none" stroke="#ff6b6b" stroke-width="2"/>
      <line x1="50" y1="35" x2="150" y2="35" stroke="#ff6b6b" stroke-width="1"/>
      <line x1="50" y1="45" x2="150" y2="45" stroke="#ff6b6b" stroke-width="1"/>
      <line x1="50" y1="55" x2="150" y2="55" stroke="#ff6b6b" stroke-width="1"/>
      <line x1="50" y1="65" x2="150" y2="65" stroke="#ff6b6b" stroke-width="1"/>
      <line x1="50" y1="75" x2="150" y2="75" stroke="#ff6b6b" stroke-width="1"/>
      <line x1="100" y1="25" x2="100" y2="85" stroke="#ff6b6b" stroke-width="2"/>
      <text x="100" y="105" class="desc" text-anchor="middle">平行线+中心线=管束符号</text>
      <text x="100" y="120" class="desc" text-anchor="middle">Parallel Lines + Center = Tube Bundle</text>
    </g>

    <!-- Rating -->
    <text x="550" y="70" class="rating" fill="#ffa726">★★★☆☆</text>
    <text x="550" y="90" class="desc">符号基本可识别，可更规范化</text>
  </g>

  <!-- Summary Box -->
  <g transform="translate(700, 80)">
    <rect x="0" y="0" width="450" height="620" rx="5" fill="#1a2535" stroke="#5a9ab8" stroke-width="1" opacity="0.8"/>
    <text x="225" y="30" class="section-title" text-anchor="middle" fill="#ffa726">📊 总体评估 Summary</text>

    <text x="20" y="70" class="desc" fill="#cccccc">1. 设备符号 (Equipment):</text>
    <text x="380" y="70" class="rating" fill="#ffa726" text-anchor="end">★★★☆☆</text>
    <text x="20" y="90" class="desc" fill="#888">• 储罐：渐变美观但非标准</text>
    <text x="20" y="105" class="desc" fill="#888">• 泵/压缩机：符号不标准</text>

    <text x="20" y="135" class="desc" fill="#cccccc">2. 仪表符号 (Instruments):</text>
    <text x="380" y="135" class="rating" fill="#ff6b6b" text-anchor="end">★★☆☆☆</text>
    <text x="20" y="155" class="desc" fill="#888">• 缺少ISA标准圆形符号</text>
    <text x="20" y="170" class="desc" fill="#888">• 纯文本标注，不符合规范</text>

    <text x="20" y="200" class="desc" fill="#cccccc">3. 管道符号 (Piping):</text>
    <text x="380" y="200" class="rating" fill="#4fc3f7" text-anchor="end">★★★★☆</text>
    <text x="20" y="220" class="desc" fill="#888">• 颜色区分清晰</text>
    <text x="20" y="235" class="desc" fill="#888">• 箭头方向正确</text>

    <text x="20" y="265" class="desc" fill="#cccccc">4. 阀门符号 (Valves):</text>
    <text x="380" y="265" class="rating" fill="#ffa726" text-anchor="end">★★★☆☆</text>
    <text x="20" y="285" class="desc" fill="#888">• 基本阀门符号存在</text>
    <text x="20" y="300" class="desc" fill="#888">• 缺少详细类型区分</text>

    <text x="20" y="330" class="desc" fill="#cccccc">5. 标识系统 (Labeling):</text>
    <text x="380" y="330" class="rating" fill="#4fc3f7" text-anchor="end">★★★★☆</text>
    <text x="20" y="350" class="desc" fill="#888">• 中文标注清晰易懂</text>
    <text x="20" y="365" class="desc" fill="#888">• 图例完整</text>

    <text x="20" y="395" class="desc" fill="#cccccc">6. 视觉效果 (Visual):</text>
    <text x="380" y="395" class="rating" fill="#4fc3f7" text-anchor="end">★★★★★</text>
    <text x="20" y="415" class="desc" fill="#888">• 深色主题现代感强</text>
    <text x="20" y="430" class="desc" fill="#888">• 颜色编码专业</text>

    <!-- Overall -->
    <rect x="20" y="460" width="410" height="50" rx="5" fill="#2a3d50" stroke="#ffd700" stroke-width="2"/>
    <text x="225" y="485" font-size="16" fill="#ffd700" text-anchor="middle" font-weight="bold">综合评分: 3.2/5 ★★★☆☆</text>
    <text x="225" y="505" font-size="10" fill="#aaaaaa" text-anchor="middle">专业度达到基础工程标准，有改进空间</text>

    <!-- Recommendations -->
    <text x="20" y="545" class="section-title" fill="#ff6b6b">🔧 优先改进项:</text>
    <text x="20" y="570" class="desc" fill="#888">1. 添加标准仪表符号（圆形+代码）</text>
    <text x="20" y="585" class="desc" fill="#888">2. 采用标准设备代码系统</text>
    <text x="20" y="600" class="desc" fill="#888">3. 添加管道编号系统</text>
  </g>
</svg>