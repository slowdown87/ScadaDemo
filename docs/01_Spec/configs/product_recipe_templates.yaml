# SCADA 产品配方模板定义
# 文档版本: v1.0
# 创建日期: 2026-04-28
# 更新日期: 2026-04-29
# 说明: 定义产品配方模板，用于自动生成产品配方参数文件

meta:
  version: "v1.0"
  created: "2026-04-28"
  updated: "2026-04-29"
  author: "SCADA系统"
  status: "active"
  source_docs:
    - "茶饮料生产线工艺流程设计.md"
  project_name: "茶饮料生产线SCADA系统"
  capacity: "50000B/H (额定) / 54000B/H (最大)"

product_recipes:
  green_tea:
    name: "绿茶"
    code: "GT"
    description: "清淡爽口的绿茶饮料"
    status: "active"

    tea_spec:
      type: "绿茶"
      grade: "一级以上"
      origin: "浙江/安徽/江苏"
      particle_size: "60目粉碎"
      storage_temp: "≤25℃"
      storage_humidity: "≤65%"

    extraction:
      water_temp_setpoint: 82
      water_temp_range: [80, 85]
      tea_ratio_min: 15
      tea_ratio_max: 20
      tea_ratio_unit: "倍"
      extraction_time_setpoint: 10
      extraction_time_range: [8, 12]
      extraction_time_unit: "min"
      agitation_speed: 50
      agitation_speed_unit: "rpm"
      stages: 3
      counter_current: true

    blending:
      incoming_tea_conc:
        value: 2.5
        unit: "°Brix"
        tolerance: "±0.2"
      sugar_syrup_conc:
        value: 65
        unit: "°Brix"
      target_brix:
        value: 10
        unit: "°Brix"
        tolerance: "±1.0"
        range: [8, 12]
      target_ph:
        value: 5.5
        tolerance: "±0.5"
        range: [5.0, 6.0]
      citric_acid_percent: 0.1
      blending_temp:
        value: 25
        unit: "℃"
        range: [20, 30]
      blending_time: 15
      blending_time_unit: "min"
      agitation_speed: 80
      agitation_speed_unit: "rpm"

    homogenization:
      pressure_setpoint: 22
      pressure_range: [20, 25]
      pressure_unit: "MPa"
      inlet_temp: 65
      inlet_temp_range: [60, 70]
      outlet_temp_max: 75
      passes: 1

    uht:
      preheat_temp: 80
      sterilization_temp: 135
      sterilization_temp_range: [133, 137]
      sterilization_time: 15
      sterilization_time_unit: "s"
      holding_temp_min: 130
      cooling_temp_outlet: 25
      cooling_temp_outlet_max: 35
      flow_rate: 3000
      flow_rate_unit: "L/h"
      back_pressure: 0.35
      back_pressure_unit: "MPa"

    filling:
      temp: 87
      temp_range: [85, 88]
      temp_unit: "℃"
      speed: 54000
      speed_unit: "瓶/h"
      bottle_volume: 500
      bottle_volume_unit: "ml"
      headspace: 15
      headspace_unit: "mm"
      cap_torque_min: 0.3
      cap_torque_max: 0.7
      cap_torque_unit: "Nm"

    quality:
      tea_polyphenol_min: 300
      tea_polyphenol_unit: "mg/kg"
      turbidity_max: 1.5
      turbidity_unit: "NTU"
      color: "黄绿色"
      flavor: "清香"

    cleaning_recipe: "CIP-BL-EX"
    cleaning_time_estimate: 4
    cleaning_time_unit: "h"

