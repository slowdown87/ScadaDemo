acceptance_standards:
  sensory:
    - parameter: "外观"
      standard: "清澈透明，无悬浮物"
      method: "目视"
    - parameter: "色泽"
      standard: "符合各产品特征色"
      method: "目视"
    - parameter: "气味"
      standard: "无异味，具有茶香"
      method: "感官评定"

  physical:
    - parameter: "Brix"
      standard: "10±1.0"
      unit: "°Brix"
      method: "在线糖度计"
    - parameter: "pH"
      standard: "5.5±0.5"
      unit: "-"
      method: "在线pH计"
    - parameter: "温度"
      standard: "25±5"
      unit: "℃"
      method: "温度传感器"

  chemical:
    - parameter: "茶多酚"
      standard: "≥300(绿茶)/≥150(红茶)/≥200(乌龙茶)"
      unit: "mg/kg"
      method: "GB/T 8313"
    - parameter: "电导率"
      standard: "<50"
      unit: "μS/cm"
      method: "在线电导率仪"

  microbiological:
    - parameter: "菌落总数"
      standard: "<100"
      unit: "CFU/mL"
      method: "GB 4789.2"
    - parameter: "大肠菌群"
      standard: "<3"
      unit: "CFU/mL"
      method: "GB 4789.3"
    - parameter: "商业无菌"
      standard: "阴性"
      unit: "-"
      method: "GB/T 4789.26"

