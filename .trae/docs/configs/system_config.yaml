# ============================================================================
# 工段定义
# ============================================================================
sections:
  WT:
    name: "水处理系统"
    name_en: "Water Treatment"
    prefix: "WT"
    number_range: [101, 199]
    plc: "PLC-1"
    process_flow: "液料线-起点"
    upstream: []
    downstream: ["TH", "EX"]
  TH:
    name: "茶叶前处理系统"
    name_en: "Tea Handling"
    prefix: "TH"
    number_range: [201, 299]
    plc: "PLC-2"
    process_flow: "液料线"
    upstream: ["WT"]
    downstream: ["EX"]
  EX:
    name: "萃取系统"
    name_en: "Extraction"
    prefix: "EX"
    number_range: [301, 399]
    plc: "PLC-3"
    process_flow: "液料线"
    upstream: ["WT", "TH"]
    downstream: ["FL"]
  FL:
    name: "过滤净化系统"
    name_en: "Filtration"
    prefix: "FL"
    number_range: [401, 499]
    plc: "PLC-4"
    process_flow: "液料线"
    upstream: ["EX"]
    downstream: ["BL"]
  BL:
    name: "调配系统"
    name_en: "Blending"
    prefix: "BL"
    number_range: [501, 599]
    plc: "PLC-5"
    process_flow: "液料线"
    upstream: ["FL"]
    downstream: ["HM"]
  HM:
    name: "均质系统"
    name_en: "Homogenization"
    prefix: "HM"
    number_range: [601, 699]
    plc: "PLC-6"
    process_flow: "液料线"
    upstream: ["BL"]
    downstream: ["UH"]
  UH:
    name: "UHT杀菌系统"
    name_en: "UHT Processing"
    prefix: "UH"
    number_range: [701, 799]
    plc: "PLC-7"
    process_flow: "液料线-CCP"
    upstream: ["HM"]
    downstream: ["BF", "PF"]
    is_ccp: true
  BF:
    name: "制瓶系统"
    name_en: "Bottle Forming"
    prefix: "BF"
    number_range: [801, 899]
    plc: "PLC-8"
    process_flow: "包装线"
    upstream: ["UH"]
    downstream: ["PF"]
  PF:
    name: "灌装系统"
    name_en: "Packaging Fill"
    prefix: "PF"
    number_range: [901, 999]
    plc: "PLC-9"
    process_flow: "包装线"
    upstream: ["UH", "BF"]
    downstream: ["CG"]
    is_high_speed: true
  CG:
    name: "旋盖系统"
    name_en: "Capping"
    prefix: "CG"
    number_range: [1001, 1099]
    plc: "PLC-10"
    process_flow: "包装线"
    upstream: ["PF"]
    downstream: ["LI"]
  LI:
    name: "灯检系统"
    name_en: "Light Inspection"
    prefix: "LI"
    number_range: [1101, 1199]
    plc: "PLC-11"
    process_flow: "包装线"
    upstream: ["CG"]
    downstream: ["CI"]
  CI:
    name: "喷码系统"
    name_en: "Coding"
    prefix: "CI"
    number_range: [1201, 1299]
    plc: "PLC-12"
    process_flow: "包装线"
    upstream: ["LI"]
    downstream: ["LB"]
  LB:
    name: "贴标系统"
    name_en: "Labeling"
    prefix: "LB"
    number_range: [1301, 1399]
    plc: "PLC-13"
    process_flow: "包装线"
    upstream: ["CI"]
    downstream: ["CA"]
  CA:
    name: "装箱系统"
    name_en: "Cartoning"
    prefix: "CA"
    number_range: [1401, 1499]
    plc: "PLC-14"
    process_flow: "包装线"
    upstream: ["LB"]
    downstream: ["PK"]
  PK:
    name: "膜包码垛系统"
    name_en: "Packing"
    prefix: "PK"
    number_range: [1501, 1599]
    plc: "PLC-15"
    process_flow: "包装线-终点"
    upstream: ["CA"]
    downstream: []
  CP:
    name: "CIP清洗系统"
    name_en: "Cleaning In Place"
    prefix: "CP"
    number_range: [1601, 1699]
    plc: "PLC-16"
    process_flow: "独立系统"
    upstream: []
    downstream: ["WT", "TH", "EX", "FL", "BL", "HM", "UH", "BF", "PF"]
    is_independent: true

# ============================================================================
# 工艺流程定义
# ============================================================================
process_flow:
  liquid_line:
    name: "液料生产线"
    sections: ["WT", "TH", "EX", "FL", "BL", "HM", "UH"]
  packaging_line:
    name: "包装生产线"
    sections: ["BF", "PF", "CG", "LI", "CI", "LB", "CA", "PK"]
  independent_systems:
    name: "独立系统"
    sections: ["CP"]

# ============================================================================
# 高速同步定义
# ============================================================================
high_speed_sync:
  - from: "PLC-8"
    from_section: "BF"
    to: "PLC-9"
    to_section: "PF"
    period_ms: 10
    content: "瓶速、瓶位"
    precision_ms: 1
  - from: "PLC-9"
    from_section: "PF"
    to: "PLC-10"
    to_section: "CG"
    period_ms: 10
    content: "灌装完成、旋盖触发"
    precision_ms: 1
  - from: "PLC-10"
    from_section: "CG"
    to: "PLC-11"
    to_section: "LI"
    period_ms: 50
    content: "产品计数"
    precision_ms: 5
  - from: "PLC-11"
    from_section: "LI"
    to: "PLC-12"
    to_section: "CI"
    period_ms: 50
    content: "剔除信号"
    precision_ms: 5
  - from: "PLC-7"
    from_section: "UH"
    to: "PLC-9"
    to_section: "PF"
    period_ms: 20
    content: "无菌料信号、速度主令"
    precision_ms: 2

# ============================================================================
# PLC间通讯矩阵
# ============================================================================
plc_comm_matrix:
  - from: "PLC-1"
    to: "PLC-3"
    method: "PROFINET I-Device"
    data: "纯水产水量"
    period_ms: 100
    desc: "调配用水"
  - from: "PLC-2"
    to: "PLC-3"
    method: "PROFINET I-Device"
    data: "茶叶原料量"
    period_ms: 100
    desc: "批次计量"
  - from: "PLC-3"
    to: "PLC-4"
    method: "PROFINET I-Device"
    data: "茶汁流量、温度、批次完成"
    period_ms: 50
    desc: "批次信号"
  - from: "PLC-4"
    to: "PLC-5"
    method: "PROFINET I-Device"
    data: "过滤后流量、批次完成"
    period_ms: 50
    desc: "批次信号"
  - from: "PLC-5"
    to: "PLC-6"
    method: "PROFINET I-Device"
    data: "调配液流量、批次完成"
    period_ms: 50
    desc: "批次信号"
  - from: "PLC-6"
    to: "PLC-7"
    method: "PROFINET I-Device"
    data: "流量、压力、温度"
    period_ms: 20
    desc: "连续信号"
  - from: "PLC-7"
    to: "PLC-9"
    method: "PROFINET I-Device"
    data: "无菌料信号、速度主令"
    period_ms: 10
    desc: "超高速"
  - from: "PLC-8"
    to: "PLC-9"
    method: "PROFINET I-Device"
    data: "瓶速、瓶位"
    period_ms: 10
    desc: "高速同步"
  - from: "PLC-9"
    to: "PLC-10"
    method: "PROFINET I-Device"
    data: "旋盖速度、扭矩设定"
    period_ms: 10
    desc: "同步控制"
  - from: "PLC-10"
    to: "PLC-11"
    method: "PROFINET I-Device"
    data: "产品计数、合格信号"
    period_ms: 50
    desc: "检测触发"
  - from: "PLC-11"
    to: "PLC-12"
    method: "PROFINET I-Device"
    data: "剔除信号"
    period_ms: 50
    desc: "不合格跳过"
  - from: "PLC-12"
    to: "PLC-13"
    method: "PROFINET I-Device"
    data: "喷码内容、打印完成"
    period_ms: 50
    desc: "标签信息"
  - from: "PLC-13"
    to: "PLC-14"
    method: "PROFINET I-Device"
    data: "产品计数"
    period_ms: 100
    desc: "装箱触发"
  - from: "PLC-14"
    to: "PLC-15"
    method: "PROFINET I-Device"
    data: "纸箱计数"
    period_ms: 100
    desc: "码垛触发"
  - from: "PLC-9"
    to: ["PLC-1", "PLC-2", "PLC-3", "PLC-4", "PLC-5", "PLC-6", "PLC-7"]
    method: "PROFINET I-Device"
    data: "急停/清洗请求"
    period_ms: 10
    desc: "安全联锁"
  - from: "PLC-16"
    to: "ALL"
    method: "PROFINET I-Device"
    data: "CIP程序启动/完成"
    period_ms: 200
    desc: "清洗信号"

