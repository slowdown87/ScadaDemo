  - from_product: "shutdown"
    from_product_name: "停产"
    to_product: "any"
    to_product_name: "每日启动"
    cip_recipes: ["CIP-WT", "CIP-PF"]
    estimated_time: 2
    estimated_time_unit: "h"
    notes: "基础清洗"
