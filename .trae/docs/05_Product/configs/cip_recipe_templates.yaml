# SCADA CIP清洗配方模板定义
# 文档版本: v1.0
# 创建日期: 2026-04-28
# 更新日期: 2026-04-29
# 说明: 定义CIP清洗配方模板，用于自动生成CIP清洗配方参数文件

meta:
  version: "v1.0"
  created: "2026-04-28"
  updated: "2026-04-29"
  author: "SCADA系统"
  status: "active"
  source_docs:
    - "CIP清洗程序规格书_auto.md"
    - "devices.yaml"
  project_name: "茶饮料生产线SCADA系统"
  capacity: "50000B/H (额定) / 54000B/H (最大)"

cip_recipes:

  cip_wt:
    name: "水处理系统清洗"
    zone: "A"
    section_codes: ["WT"]
    recipe_id: "CIP-WT"

    trigger_conditions:
      - "每日生产前"
      - "停产超过48小时"
      - "水质检测不合格"

    steps:
      - step: 1
        name: "预冲洗"
        medium: "原水"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 3
        flow_rate_unit: "m³/h"
        drain: true
        acceptance: "冲水清澈，无杂质"

      - step: 2
        name: "碱洗"
        medium: "NaOH"
        concentration: 2
        concentration_unit: "%"
        temp: 85
        temp_unit: "℃"
        time: 20
        time_unit: "min"
        flow_rate: 3
        flow_rate_unit: "m³/h"
        circulation: true
        acceptance: "回水电导率稳定，pH>12"

      - step: 3
        name: "中间冲洗"
        medium: "原水"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 3
        flow_rate_unit: "m³/h"
        drain: true
        acceptance: "pH<8.5"

      - step: 4
        name: "酸洗"
        medium: "HNO₃"
        concentration: 1
        concentration_unit: "%"
        temp: 60
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 3
        flow_rate_unit: "m³/h"
        circulation: true
        acceptance: "回水电导率稳定"

      - step: 5
        name: "最终冲洗"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 3
        flow_rate_unit: "m³/h"
        drain: true
        acceptance: "电导率<50μS/cm, pH 6.5-7.5"

    notes:
      - "RO膜组件不参与清洗，需单独处理"
      - "UV灯管需拆下后才能清洗"
      - "水质检测合格后方可生产"

    total_time: 65
    total_time_unit: "min"

  cip_ex:
    name: "茶叶前处理+萃取系统清洗"
    zone: "B"
    section_codes: ["TH", "EX"]
    recipe_id: "CIP-EX"

    trigger_conditions:
      - "每批次茶叶用完"
      - "停产超过24小时"
      - "产品切换（绿茶↔红茶↔乌龙茶）"

    steps:
      - step: 1
        name: "预冲洗"
        medium: "纯水"
        temp: 50
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        drain: true
        acceptance: "冲水无茶渣"

      - step: 2
        name: "碱洗"
        medium: "NaOH"
        concentration: 2
        concentration_unit: "%"
        temp: 85
        temp_unit: "℃"
        time: 30
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        circulation: true
        acceptance: "回水电导率稳定，pH>12"

      - step: 3
        name: "中间冲洗"
        medium: "纯水"
        temp: 60
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        drain: true
        acceptance: "pH<8.5"

      - step: 4
        name: "酸洗"
        medium: "HNO₃"
        concentration: 1
        concentration_unit: "%"
        temp: 60
        temp_unit: "℃"
        time: 20
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        circulation: true
        acceptance: "回水电导率稳定"

      - step: 5
        name: "最终冲洗"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        drain: true
        acceptance: "电导率<50μS/cm"

    notes:
      - "茶叶储罐需人工清理残余茶叶后再启动CIP"
      - "萃取罐内部冲洗球必须全部动作"
      - "清洗完成后打开EX-106检查内部清洁度"

    total_time: 90
    total_time_unit: "min"

  cip_fl:
    name: "膜过滤系统清洗"
    zone: "C"
    section_codes: ["FL"]
    recipe_id: "CIP-FL"

    trigger_conditions:
      - "每批次过滤完成后"
      - "膜压差超过0.15MPa"
      - "停产超过24小时"
      - "每日待机前"

    steps:
      - step: 1
        name: "顶料"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "产品完全顶出"

      - step: 2
        name: "反冲洗"
        medium: "纯水"
        temp: 50
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 3
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "出水清澈"

      - step: 3
        name: "碱洗"
        medium: "NaOH"
        concentration: 2
        concentration_unit: "%"
        temp: 45
        temp_unit: "℃"
        time: 30
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        circulation: true
        acceptance: "回水电导稳定"

      - step: 4
        name: "冲洗"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "pH<8.5"

      - step: 5
        name: "酸洗"
        medium: "HNO₃"
        concentration: 1
        concentration_unit: "%"
        temp: 35
        temp_unit: "℃"
        time: 20
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        circulation: true
        acceptance: "回水电导稳定"

      - step: 6
        name: "最终冲洗"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "电导率<50μS/cm"

      - step: 7
        name: "膜完整性测试"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        pressure_test: 0.2
        pressure_test_unit: "MPa"
        hold_time: 5
        hold_time_unit: "min"
        acceptance: "压降<10%"

    notes:
      - "膜组件需定期进行完整性测试"
      - "膜压差超过0.15MPa需进行化学加强清洗"
      - "长期停用需进行膜保护处理"

    total_time: 95
    total_time_unit: "min"

  cip_bl:
    name: "调配系统清洗"
    zone: "D"
    section_codes: ["BL"]
    recipe_id: "CIP-BL"

    trigger_conditions:
      - "每批次调配完成后"
      - "产品切换"
      - "停产超过24小时"

    steps:
      - step: 1
        name: "预冲洗"
        medium: "纯水"
        temp: 40
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        agitation: "低速"
        drain: true
        acceptance: "无残留糖液"

      - step: 2
        name: "碱洗"
        medium: "NaOH"
        concentration: 2
        concentration_unit: "%"
        temp: 85
        temp_unit: "℃"
        time: 30
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        agitation: "低速"
        circulation: true
        acceptance: "回水电导稳定，pH>12"

      - step: 3
        name: "冲洗"
        medium: "纯水"
        temp: 50
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        agitation: "低速"
        acceptance: "pH<8.5"

      - step: 4
        name: "酸洗"
        medium: "HNO₃"
        concentration: 1
        concentration_unit: "%"
        temp: 60
        temp_unit: "℃"
        time: 20
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        agitation: "低速"
        circulation: true
        acceptance: "回水电导稳定"

      - step: 5
        name: "最终冲洗"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        acceptance: "电导率<50μS/cm"

      - step: 6
        name: "消毒"
        medium: "H₂O₂"
        concentration: 0.5
        concentration_unit: "%"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        acceptance: "无残留"

    notes:
      - "糖浆罐BL-103使用前需用85℃热水溶解残留糖"
      - "酸液罐BL-104需单独酸洗，避免与碱液混合"
      - "调配罐内部需全面冲刷，包括搅拌轴"

    total_time: 100
    total_time_unit: "min"

  cip_uh:
    name: "UHT杀菌系统清洗"
    zone: "E"
    section_codes: ["UH"]
    recipe_id: "CIP-UH"

    trigger_conditions:
      - "每48小时"
      - "停产超过12小时"
      - "产品切换"
      - "微生物检测不合格"

    steps:
      - step: 1
        name: "纯水顶料"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 5
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "产品完全顶出"

      - step: 2
        name: "碱洗"
        medium: "NaOH"
        concentration: 2
        concentration_unit: "%"
        temp: 85
        temp_unit: "℃"
        time: 45
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_range: [0.3, 0.5]
        pressure_unit: "MPa"
        circulation: true
        acceptance: "回流温度>80℃"

      - step: 3
        name: "纯水冲洗"
        medium: "纯水"
        temp: 70
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "pH<8.5"

      - step: 4
        name: "酸洗"
        medium: "HNO₃"
        concentration: 1
        concentration_unit: "%"
        temp: 60
        temp_unit: "℃"
        time: 30
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_range: [0.3, 0.5]
        pressure_unit: "MPa"
        circulation: true
        acceptance: "回流温度>55℃"

      - step: 5
        name: "纯水冲洗"
        medium: "纯水"
        temp: "常温"
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        flow_rate: 2
        flow_rate_unit: "m³/h"
        pressure_max: 0.3
        pressure_unit: "MPa"
        acceptance: "电导率<50μS/cm"

      - step: 6
        name: "无菌验证"
        medium: "-"
        temp: "常温"
        temp_unit: "℃"
        time: 2880
        time_unit: "min"
        time_note: "48小时培养"
        acceptance: "无菌培养48h合格"

    notes:
      - "清洗过程中保温管必须保持满管状态"
      - "无菌储罐清洗后需充无菌空气保持正压"
      - "清洗完成后需进行无菌验证"
      - "新批次生产前需进行3次SIP"

    total_time: 110
    total_time_unit: "min"

  cip_pf:
    name: "灌装系统清洗"
    zone: "F"
    section_codes: ["PF"]
    recipe_id: "CIP-PF"

    trigger_conditions:
      - "每12小时"
      - "停产超过8小时"
      - "产品切换"

    steps:
      - step: 1
        name: "预冲洗"
        medium: "RO水"
        temp: 50
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        acceptance: "冲洗管道残留"

      - step: 2
        name: "碱洗"
        medium: "NaOH"
        concentration: 2
        concentration_unit: "%"
        temp: 85
        temp_unit: "℃"
        time: 40
        time_unit: "min"
        acceptance: "CIP球阀切换冲刷"

      - step: 3
        name: "冲洗"
        medium: "RO水"
        temp: 60
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        acceptance: "冲洗至中性"

      - step: 4
        name: "酸洗"
        medium: "HNO₃"
        concentration: 1
        concentration_unit: "%"
        temp: 60
        temp_unit: "℃"
        time: 30
        time_unit: "min"
        acceptance: "CIP球阀切换冲刷"

      - step: 5
        name: "最终冲洗"
        medium: "RO水"
        temp: "常温"
        temp_unit: "℃"
        time: 15
        time_unit: "min"
        acceptance: "电导率<50μS/cm"

      - step: 6
        name: "消毒"
        medium: "H₂O₂"
        concentration: 0.5
        concentration_unit: "%"
        temp: "常温"
        temp_unit: "℃"
        time: 10
        time_unit: "min"
        acceptance: "无残留"

    notes:
      - "吹灌一体机内部阀需全部打开清洗"
      - "料缸内部需全面冲刷"
      - "清洗完成后检查灌装阀无残留水渍"
      - "消毒后需自然干燥30分钟"

    total_time: 120
    total_time_unit: "min"

  cip_all:
    name: "全线清洗"
    zone: "ALL"
    section_codes: ["WT", "TH", "EX", "FL", "BL", "HM", "UH", "PF"]
    recipe_id: "CIP-ALL"

    trigger_conditions:
      - "长期停产（超过72小时）"
      - "年度维护前"
      - "重大设备检修后"

    steps:
      - sequence: 1
        section: "WT"
        recipe: "CIP-WT"
      - sequence: 2
        section: "EX"
        recipe: "CIP-EX"
      - sequence: 3
        section: "FL"
        recipe: "CIP-FL"
      - sequence: 4
        section: "BL"
        recipe: "CIP-BL"
      - sequence: 5
        section: "UH"
        recipe: "CIP-UH"
      - sequence: 6
        section: "PF"
        recipe: "CIP-PF"

    total_time: 360
    total_time_unit: "min"
    total_time_note: "约6小时"

