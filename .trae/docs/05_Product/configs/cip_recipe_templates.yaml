    from_product_name: "绿茶"
    to_product: "red_tea"
    to_product_name: "红茶"
    cip_recipes: ["CIP-BL", "CIP-EX"]
    estimated_time: 4
    estimated_time_unit: "h"
    notes: "茶叶系统需要彻底清洗"

  - from_product: "green_tea"
    from_product_name: "绿茶"
    to_product: "oolong_tea"
    to_product_name: "乌龙茶"
