# Instrument_List 仪表清单 配置

meta:
  version: "v1.0"
  created: "2026-04-29"
  updated: "2026-04-29"
  author: "SCADA系统"
  status: "active"
  description: "仪表清单配置"
  data_source: "../_templates/devices.yaml"
  source_docs:
    - "devices.yaml"
  project_name: "茶饮料生产线SCADA系统"

template:
  type: "excel"
  engine: "openpyxl"
  sheets:
    - name: "仪表清单"
      header:
        - "位号"
        - "仪表名称"
        - "安装位置"
        - "类型"
        - "测量范围"
        - "单位"
        - "品牌"
        - "型号"
        - "数量"
        - "精度"
        - "信号类型"
        - "供电"
        - "备注"

    - name: "温度仪表"
      header:
        - "位号"
        - "名称"
        - "安装位置"
        - "类型"
        - "范围"
        - "单位"
        - "精度"
        - "品牌"
        - "型号"

    - name: "压力仪表"
      header:
        - "位号"
        - "名称"
        - "安装位置"
        - "范围"
        - "单位"
        - "精度"
        - "品牌"
        - "型号"

    - name: "流量仪表"
      header:
        - "位号"
        - "名称"
        - "安装位置"
        - "范围"
        - "单位"
        - "精度"
        - "品牌"
        - "型号"
        - "通讯协议"

    - name: "液位仪表"
      header:
        - "位号"
        - "名称"
        - "安装位置"
        - "类型"
        - "范围"
        - "单位"
        - "精度"
        - "品牌"
        - "型号"

    - name: "分析仪表"
      header:
        - "位号"
        - "名称"
        - "安装位置"
        - "类型"
        - "范围"
        - "单位"
        - "精度"
        - "品牌"
        - "型号"
        - "通讯协议"

data_sources:
  temperature_sensors:
    source: "devices"
    path: "devices[].sensors[?code.startsWith('TT')]"
    transform:
      - tag: "{{ device.id }}-{{ sensor.code }}"
        name: "{{ device.name }}{{ sensor.name }}"
        location: "{{ device.section }}工段"
        type: "温度传感器"
        range: "{{ sensor.range[0] }}-{{ sensor.range[1] }}"
        unit: "{{ sensor.unit }}"
        brand: "E+H"
        model: "TR45"
        quantity: 1
        accuracy: "±0.5℃"
        signal: "4-20mA"
        power: "24VDC"

  pressure_sensors:
    source: "devices"
    path: "devices[].sensors[?code.startsWith('PT')]"
    transform:
      - tag: "{{ device.id }}-{{ sensor.code }}"
        name: "{{ device.name }}{{ sensor.name }}"
        location: "{{ device.section }}工段"
        range: "{{ sensor.range[0] }}-{{ sensor.range[1] }}"
        unit: "{{ sensor.unit }}"
        accuracy: "±0.5%FS"
        brand: "E+H"
        model: "PT51"
        signal: "4-20mA"
        power: "24VDC"

  flow_sensors:
    source: "devices"
    path: "devices[].sensors[?code.startsWith('FT')]"
    transform:
      - tag: "{{ device.id }}-{{ sensor.code }}"
        name: "{{ device.name }}{{ sensor.name }}"
        location: "{{ device.section }}工段"
        range: "{{ sensor.range[0] }}-{{ sensor.range[1] }}"
        unit: "{{ sensor.unit }}"
        accuracy: "±0.5%RD"
        brand: "E+H"
        model: "10P"
        protocol: "Modbus RTU"

  level_sensors:
    source: "devices"
    path: "devices[].sensors[?code.startsWith('LT')]"
    transform:
      - tag: "{{ device.id }}-{{ sensor.code }}"
        name: "{{ device.name }}{{ sensor.name }}"
        location: "{{ device.section }}工段"
        type: "静压式液位计"
        range: "{{ sensor.range[0] }}-{{ sensor.range[1] }}"
        unit: "%"
        accuracy: "±0.5%FS"
        brand: "E+H"
        model: "FTL51"
        signal: "4-20mA"

  analyzer_sensors:
    source: "devices"
    path: "devices[].sensors[?code.startsWith('AT') or code.startsWith('BT') or code.startsWith('CtT')]"
    transform:
      - tag: "{{ device.id }}-{{ sensor.code }}"
        name: "{{ device.name }}{{ sensor.name }}"
        location: "{{ device.section }}工段"
        type: "{{ sensor.type }}"
        range: "{{ sensor.range[0] }}-{{ sensor.range[1] }}"
        unit: "{{ sensor.unit }}"
        accuracy: "±1%RD"
        brand: "E+H"
        model: "CTE"
        protocol: "Modbus RTU"

output:
  path: "../07_Engineering/Instrument_List_auto.xlsx"
  overwrite: true
