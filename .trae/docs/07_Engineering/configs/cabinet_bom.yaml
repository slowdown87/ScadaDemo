# Cabinet_BOM 电控柜元器件清单 配置
# 配置驱动 - 模板名称 + 数据源 + 输出路径

meta:
  version: "v1.0"
  created: "2026-04-29"
  updated: "2026-04-29"
  author: "SCADA系统"
  status: "active"
  description: "电控柜元器件清单配置"
  data_source: "../_templates/devices.yaml"
  source_docs:
    - "devices.yaml"
  project_name: "茶饮料生产线SCADA系统"

template:
  type: "excel"
  engine: "openpyxl"
  sheets:
    - name: "PLC柜元器件清单"
      header:
        - "序号"
        - "位号"
        - "名称"
        - "规格型号"
        - "品牌"
        - "数量"
        - "单位"
        - "备注"
      groups:
        - name: "PLC系统"
          items:
            - type: "plc_cpu"
              tag: "CPU模块"
            - type: "plc_io_di"
              tag: "数字量输入模块"
            - type: "plc_io_do"
              tag: "数字量输出模块"
            - type: "plc_io_ai"
              tag: "模拟量输入模块"
            - type: "plc_io_ao"
              tag: "模拟量输出模块"
            - type: "plc_comm"
              tag: "通讯模块"
            - type: "plc_power"
              tag: "电源模块"

        - name: "变频器系统"
          items:
            - type: "inverter"
              tag: "变频器"

        - name: "低压电气"
          items:
            - type: "contactor"
              tag: "接触器"
            - type: "relay_thermal"
              tag: "热继电器"
            - type: "circuit_breaker"
              tag: "断路器"
            - type: "fuse"
              tag: "熔断器"
            - type: "relay"
              tag: "中间继电器"

        - name: "柜体附件"
          items:
            - type: "terminal_block"
              tag: "端子排"
            - type: "switch_power"
              tag: "开关电源"
            - type: "indicator_light"
              tag: "指示灯"
            - type: "push_button"
              tag: "按钮"
            - type: "cabinet_fan"
              tag: "控制柜风扇"
            - type: "lighting"
              tag: "柜内照明"

    - name: "按PLC统计"
      header:
        - "PLC编号"
        - "工段"
        - "CPU模块"
        - "DI模块"
        - "DO模块"
        - "AI模块"
        - "AO模块"
        - "变频器"
        - "合计"

data_sources:
  plc_cpu:
    source: "comm_templates"
    path: "plc_config[*].{plc: id, name: name}"
    filter: "type == 'cpu'"

  plc_modules:
    source: "devices"
    path: "devices"
    template:
      plc_di: "每PLC约40点DI"
      plc_do: "每PLC约32点DO"
      plc_ai: "每PLC约16点AI"
      plc_ao: "每PLC约8点AO"

  inverter:
    source: "devices"
    path: "pumps[?is_inverter]"
    fields: ["id", "name", "power_kw"]

  low_voltage:
    contactor:
      count: 80
      spec: "25A/40A"
      brand: "SIEMENS"
    thermal:
      count: 40
      spec: "5-25A/20-50A"
      brand: "SIEMENS"
    breaker:
      count: 60
      spec: "10A/25A/40A"
      brand: "SIEMENS"
    fuse:
      count: 100
      spec: "10A"
      brand: "SIEMENS"
    relay:
      count: 120
      spec: "24VDC"
      brand: "SIEMENS"

  cabinet_accessories:
    terminal_block:
      count: 500
      spec: "UK 2.5"
      brand: "WAGO"
    power_supply:
      count: 15
      spec: "24VDC 10A"
      brand: "SIEMENS"
    indicator_light:
      count: 60
      spec: "24VDC 红/绿/黄"
      brand: "SIEMENS"
    push_button:
      count: 40
      spec: "22mm 绿/红"
      brand: "SIEMENS"
    cabinet_fan:
      count: 15
      spec: "220VAC 120mm"
      brand: "ebm-papst"
    cabinet_light:
      count: 15
      spec: "LED 24V 5W"
      brand: "国产"

output:
  path: "../07_Engineering/Cabinet_BOM_auto.xlsx"
  overwrite: true
