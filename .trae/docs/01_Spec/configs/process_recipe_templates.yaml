# SCADA 工艺配方模板定义
# ============================================================================
# 文档版本: v1.1
# 创建日期: 2026-04-28
# 更新日期: 2026-05-07
# 说明: 定义工艺配方模板，用于自动生成工艺配方参数文件
#
# 重要变更 (v1.1):
#   - 从 system_config.yaml 移入工艺详细数据
#   - 包含: product_recipes, process_params, ccp_config, cip_program
#   - 本文件为工艺详细数据真相源
#
# 依赖本文件的自动生成文档:
#   - 茶饮料_CIP清洗程序规格书_auto.md
#   - 茶饮料_工艺配方_auto.md
# ============================================================================

meta:
  version: "v1.0"
  created: "2026-04-28"
  updated: "2026-04-29"
  author: "SCADA系统"
  status: "active"
  source_docs:
    - "茶饮料生产线工艺流程设计.md"
  project_name: "茶饮料生产线SCADA系统"
  capacity: "50000B/H (额定) / 54000B/H (最大)"

process_recipes:

  water_treatment:
    name: "水处理工艺"
    section: "WT"
    recipe_id: "PR-WT-001"

    parameters:
      raw_water:
        temp: 25
        temp_unit: "℃"
        pressure_min: 0.3
        pressure_max: 0.5
        pressure_unit: "MPa"

      multimedia_filter:
        flow_rate: 10
        flow_rate_unit: "m³/h"
        backwash_interval: 8
        backwash_interval_unit: "h"
        filter_media: "石英砂+无烟煤"

      active_carbon_filter:
        flow_rate: 10
        flow_rate_unit: "m³/h"
        backwash_interval: 24
        backwash_interval_unit: "h"

      ro_system:
        flow_rate_product: 5
        flow_rate_unit: "m³/h"
        recovery_rate_min: 75
        recovery_rate_unit: "%"
        conductivity_max: 10
        conductivity_unit: "μS/cm"
        pressure_normal: 1.2
        pressure_unit: "MPa"

      ion_exchange:
        conductivity_max: 10
        conductivity_unit: "μS/cm"
        regeneration_interval: 72
        regeneration_interval_unit: "h"

      uv_sterilizer:
        power: 40
        power_unit: "W"
        efficacy_min: 99.9
        efficacy_unit: "%"

      storage_tank:
        temp_max: 30
        temp_unit: "℃"
        temp_alarm_high: 35

    cleaning_recipe: "CIP-WT"

  extraction_process:
    name: "三级逆流萃取工艺"
    section: "EX"
    recipe_id: "PR-EX-001"

    parameters:
      stage_1:
        name: "一级萃取罐"
        tank_id: "EX-101"
        water_temp: 85
        water_temp_range: [80, 95]
        water_temp_unit: "℃"
        tea_load: 200
        tea_load_unit: "kg"
        water_volume: 3.5
        water_volume_unit: "m³"
        extraction_time: 10
        extraction_time_unit: "min"
        agitation_speed: 50
        agitation_speed_unit: "rpm"

      stage_2:
        name: "二级萃取罐"
        tank_id: "EX-102"
        water_temp: 90
        water_temp_range: [85, 95]
        water_temp_unit: "℃"
        tea_load: 150
        tea_load_unit: "kg"
        water_volume: 3.0
        water_volume_unit: "m³"
        extraction_time: 8
        extraction_time_unit: "min"
        agitation_speed: 60
        agitation_speed_unit: "rpm"

      stage_3:
        name: "三级萃取罐"
        tank_id: "EX-103"
        water_temp: 95
        water_temp_range: [90, 98]
        water_temp_unit: "℃"
        tea_load: 100
        tea_load_unit: "kg"
        water_volume: 2.5
        water_volume_unit: "m³"
        extraction_time: 5
        extraction_time_unit: "min"
        agitation_speed: 55
        agitation_speed_unit: "rpm"

      separation:
        temperature: 80
        temperature_unit: "℃"
        centrifuge_speed: 6000
        centrifuge_speed_unit: "rpm"
        separation_factor: 9000

      cooling:
        target_temp: 25
        target_temp_unit: "℃"
        cooling_time_max: 30
        cooling_time_unit: "min"

    batch_size:
      green_tea:
        value: 600
        unit: "L/batch"
      red_tea:
        value: 650
        unit: "L/batch"
      oolong_tea:
        value: 620
        unit: "L/batch"

    cleaning_recipe: "CIP-EX"

  filtration_process:
    name: "过滤净化工艺"
    section: "FL"
    recipe_id: "PR-FL-001"

    parameters:
      disc_centrifuge:
        model: "DF-616"
        capacity: 6000
        capacity_unit: "L/h"
        speed: 6500
        speed_unit: "rpm"
        separation_factor: 9000
        inlet_pressure_max: 0.25
        inlet_pressure_unit: "MPa"

      ultrafiltration:
        membrane_type: "陶瓷膜"
        pore_size: 0.1
        pore_size_unit: "μm"
        capacity: 6000
        capacity_unit: "L/h"
        inlet_pressure_normal: 0.3
        inlet_pressure_unit: "MPa"
        inlet_pressure_max: 0.35
        trans_membrane_pressure_max: 0.15
        trans_membrane_pressure_unit: "MPa"
        temperature_range: [55, 75]
        temperature_unit: "℃"
        flux_normal: 50
        flux_unit: "L/(m²·h)"
        backwash_interval: 30
        backwash_interval_unit: "min"

    cleaning_recipe: "CIP-FL"

  blending_process:
    name: "产品调配工艺"
    section: "BL"
    recipe_id: "PR-BL-001"

    parameters:
      tea_concentrate:
        brix: 2.5
        brix_range: [2.3, 2.7]
        brix_unit: "°Brix"
        ph: 5.8
        ph_range: [5.5, 6.2]
        temp_max: 30
        temp_unit: "℃"

      sugar_syrup:
        brix: 65
        brix_range: [63, 67]
        brix_unit: "°Brix"
        temp: 60
        temp_unit: "℃"
        dissolution_time: 30
        dissolution_time_unit: "min"

      citric_acid_solution:
        concentration: 50
        concentration_unit: "%"
        temp: 40
        temp_unit: "℃"

      target_blend:
        brix: 10
        brix_range: [8, 12]
        brix_tolerance: "±2.0"
        brix_unit: "°Brix"
        ph: 5.5
        ph_range: [5.0, 6.0]
        ph_tolerance: "±0.5"
        temp: 25
        temp_range: [20, 30]
        temp_unit: "℃"

      blending_sequence:
        - step: 1
          action: "添加纯水"
          volume: 30
          volume_unit: "%"
        - step: 2
          action: "添加茶浓缩汁"
          volume: 40
          volume_unit: "%"
        - step: 3
          action: "添加糖浆"
          target_brix: 10
          tolerance: "±1.0"
        - step: 4
          action: "添加酸液"
          target_ph: 5.5
          tolerance: "±0.5"
        - step: 5
          action: "添加香精"
          volume: 0.1
          volume_unit: "%"
        - step: 6
          action: "补水至目标量"
          volume: 100
          volume_unit: "%"
        - step: 7
          action: "搅拌混合"
          time: 15
          time_unit: "min"
          speed: 80
          speed_unit: "rpm"

      quality_check:
        - parameter: "Brix"
          instrument: "在线糖度计"
          frequency: "每5分钟"
        - parameter: "pH"
          instrument: "在线pH计"
          frequency: "连续监控"

    batch_size:
      tank_1:
        value: 5000
        unit: "L/batch"
      tank_2:
        value: 5000
        unit: "L/batch"

    cleaning_recipe: "CIP-BL"

  homogenization_process:
    name: "高压均质工艺"
    section: "HM"
    recipe_id: "PR-HM-001"

    parameters:
      inlet:
        temp: 65
        temp_range: [60, 70]
        temp_unit: "℃"
        pressure_min: 0.2
        pressure_unit: "MPa"

      homogenizer:
        model: "GYB-3000"
        pressure_setpoint: 22
        pressure_range: [20, 25]
        pressure_unit: "MPa"
        pressure_alarm_low: 18
        pressure_alarm_high: 27
        capacity: 3000
        capacity_unit: "L/h"
        motor_power: 75
        motor_power_unit: "kW"

      outlet:
        temp_max: 75
        temp_unit: "℃"
        pressure_normal: 0.3
        pressure_unit: "MPa"

      valve_group:
        inlet_valve: "BV-107"
        outlet_valve: "BV-108"
        bypass_valve: "BV-109"
        startup_sequence:
          - "打开BV-108"
          - "打开BV-107"
          - "启动均质机"
        shutdown_sequence:
          - "停均质机"
          - "关闭BV-107"
          - "关闭BV-108"

      particle_size:
        target: 1.5
        target_unit: "μm"
        max: 2.0
        measurement: "粒度分析仪"

    cleaning_recipe: "CIP-BL"

  uht_process:
    name: "UHT超高温瞬时杀菌工艺"
    section: "UH"
    recipe_id: "PR-UH-001"

    parameters:
      preheating:
        temp_setpoint: 80
        temp_range: [75, 85]
        temp_unit: "℃"
        hold_time: 10
        hold_time_unit: "s"

      sterilization:
        temp_setpoint: 135
        temp_range: [133, 137]
        temp_unit: "℃"
        time: 15
        time_unit: "s"
        critical_limit: 130
        critical_limit_unit: "℃"

      holding:
        temp_min: 130
        temp_min_unit: "℃"
        time: 15
        time_unit: "s"

      cooling:
        stage_1_temp: 90
        stage_1_temp_unit: "℃"
        stage_2_temp: 50
        stage_2_temp_unit: "℃"
        outlet_temp: 25
        outlet_temp_max: 35
        outlet_temp_unit: "℃"

      system:
        flow_rate: 3000
        flow_rate_unit: "L/h"
        flow_rate_tolerance: "±10%"
        back_pressure: 0.35
        back_pressure_range: [0.2, 0.5]
        back_pressure_unit: "MPa"

      quality:
        sterility: "商业无菌"
        f0_value_min: 8
        shelf_life: 12
        shelf_life_unit: "月"

      aseptic_tank:
        tank_id: "UH-105"
        capacity: 3000
        capacity_unit: "L"
        temp_max: 35
        temp_unit: "℃"
        pressure_max: 0.05
        pressure_unit: "MPa"
        pressure_normal: 0.02

    cleaning_recipe: "CIP-UH"

  filling_process:
    name: "热灌装工艺"
    section: "PF"
    recipe_id: "PR-PF-001"

    parameters:
      bottle:
        material: "PET"
        volume_nominal: 500
        volume_unit: "ml"
        volume_actual_range: [495, 505]
        temperature: 87
        temperature_range: [85, 88]
        temperature_unit: "℃"

      filler:
        model: "SBL-FG54000"
        heads: 72
        speed_nominal: 54000
        speed_range: [50000, 58000]
        speed_unit: "瓶/h"
        fill_volume: 500
        fill_volume_unit: "ml"
        fill_accuracy: "±1.5%"
        level_accuracy: "±5mm"

      capper:
        model: "12头旋盖机"
        heads: 12
        torque_min: 0.3
        torque_max: 0.7
        torque_unit: "Nm"
        seal_check: "扭矩监控"

      cooling:
        inlet_temp: 87
        outlet_temp_max: 38
        tunnel_length: 40
        tunnel_length_unit: "m"
        cooling_method: "风冷+水冷"

      quality:
        leak_rate_max: 0.1
        leak_rate_unit: "%"
        headspace_height: 15
        headspace_height_unit: "mm"

    cleaning_recipe: "CIP-PF"

  tea_handing_process:
    name: "茶叶前处理工艺"
    section: "TH"
    recipe_id: "PR-TH-001"

    parameters:
      storage:
        tank_id: "TH-101"
        capacity: 5000
        capacity_unit: "kg"
        temp_range: [15, 25]
        temp_unit: "℃"
        humidity_max: 65
        humidity_unit: "%"
        inspection_interval: 72
        inspection_interval_unit: "h"

      magnetic_separator:
        model: "RC-75"
        magnetic_strength: 12000
        magnetic_strength_unit: "Gauss"
        belt_speed: 1.5
        belt_speed_unit: "m/s"
        capacity: 3000
        capacity_unit: "kg/h"

      metal_detector:
        model: "M3000"
        sensitivity: 1.5
        sensitivity_unit: "mm"
        detection_type: "Fe/Non-Fe/Sus"
        reject_mode: "气动翻板"
        belt_speed: 1.2
        belt_speed_unit: "m/s"

      conveyor:
        type: "链板式"
        width: 800
        width_unit: "mm"
        length: 10
        length_unit: "m"
        speed_range: [0.5, 2.0]
        speed_unit: "m/s"
        Inclination_angle: 15
        inclination_angle_unit: "°"

      dust_collector:
        model: "DC-500"
        airflow: 5000
        airflow_unit: "m³/h"
        filter_area: 20
        filter_area_unit: "m²"
        filtration_accuracy: 99.9
        filtration_accuracy_unit: "%"

      weighing:
        model: "ICS-450"
        weighing_range: [0, 3000]
        weighing_range_unit: "kg"
        accuracy: 0.5
        accuracy_unit: "kg"
        calibration_interval: 24
        calibration_interval_unit: "h"

    cleaning_recipe: "CIP-EX"

  cip_station_process:
    name: "CIP清洗站工艺"
    section: "CP"
    recipe_id: "PR-CP-001"

    parameters:
      cip_tank:
        acid_tank_id: "CP-201"
        acid_tank_capacity: 2000
        acid_tank_capacity_unit: "L"
        alkali_tank_id: "CP-202"
        alkali_tank_capacity: 2000
        alkali_tank_capacity_unit: "L"
        water_tank_id: "CP-203"
        water_tank_capacity: 3000
        water_tank_capacity_unit: "L"

      dosing_system:
        acid_pump: "DP-125"
        acid_pump_capacity: 500
        acid_pump_capacity_unit: "L/h"
        alkali_pump: "DP-126"
        alkali_pump_capacity: 500
        alkali_pump_capacity_unit: "L/h"
        conductivity_sensor: "CE-101"
        concentration_accuracy: 0.1
        concentration_accuracy_unit: "%"

      supply_unit:
        supply_pump: "CP-301"
        supply_pump_capacity: 20
        supply_pump_capacity_unit: "m³/h"
        supply_pressure: 0.4
        supply_pressure_unit: "MPa"
        return_pump: "CP-302"
        return_pump_capacity: 20
        return_pump_capacity_unit: "m³/h"
        flow_meter: "FT-101"
        flow_range: [0, 20]
        flow_range_unit: "m³/h"

      heating_system:
        heater_type: "板式换热器"
        heater_capacity: 150
        heater_capacity_unit: "kW"
        temp_max: 95
        temp_max_unit: "℃"
        heating_rate: 5
        heating_rate_unit: "℃/min"

    cleaning_recipe: "CIP-CP"

  packaging_process:
    name: "膜包码垛工艺"
    section: "PK"
    recipe_id: "PR-PK-001"
    cleaning_recipe: "CIP-PK"

    parameters:
      film_wrapper:
        model: "FW-450"
        film_width: 450
        film_width_unit: "mm"
        film_thickness_range: [0.03, 0.08]
        film_thickness_range_unit: "mm"
        package_size_range: [200, 400]
        package_size_range_unit: "mm"
        package_speed: 60
        package_speed_unit: "包/min"

      robot_palletizer:
        model: "PR-1250"
        payload: 1250
        payload_unit: "kg"
        reach: 3200
        reach_unit: "mm"
        axes: 6
        cycle_time: 4.5
        cycle_time_unit: "s"
        position_accuracy: 0.5
        position_accuracy_unit: "mm"

      conveyor_system:
        type: "滚筒式"
        width: 600
        width_unit: "mm"
        length: 15
        length_unit: "m"
        speed: 15
        speed_unit: "m/min"
        load_capacity: 50
        load_capacity_unit: "kg/roller"

      pallet:
        type: "塑料托盘"
        size: "1200×1000"
        size_unit: "mm"
        height: 150
        height_unit: "mm"
        max_load: 1000
        max_load_unit: "kg"

# ============================================================================
# 以下内容从 system_config.yaml 移入 (v1.2)
# ============================================================================

product_recipes:
  tea_types:
    green_tea:
      name: "绿茶"
      water_temp: "80-85℃"
      tea_water_ratio: "1:12-1:15"
      extraction_time: "15min"
      tea_polyphenol: "≥300mg/kg"
    black_tea:
      name: "红茶"
      water_temp: "90-95℃"
      tea_water_ratio: "1:10-1:12"
      extraction_time: "20min"
      tea_polyphenol: "≥150mg/kg"
    oolong_tea:
      name: "乌龙茶"
      water_temp: "85-90℃"
      tea_water_ratio: "1:10-1:15"
      extraction_time: "18min"
      tea_polyphenol: "≥200mg/kg"
  unified_quality:
    final_ph: 5.5
    ph_range: "5.0-6.0"
    final_brix: 10
    brix_range: "8-12°Bx"
    fill_temp: "25-30℃"
    fill_temp_range: "25-35℃"
    fill_capacity: "500ml"
    fill_tolerance: "±1.5%"

# ============================================================================
# process_params - 从 system_config.yaml 移入
# ============================================================================
process_params:
  WT:
    name: "水处理系统"
    equipment: "多介质过滤器+活性炭+RO+离子交换+UV"
    batch_size: "10m³"
    capacity: "5m³/h"
    params:
      - name: "RO产水量"
        value: "5m³/h"
        range: "0-10m³/h"
        control: "PID控制"
      - name: "RO前压力"
        value: "0.6-0.8MPa"
        range: "0-1MPa"
        control: "PID控制"
      - name: "产水电导率"
        value: "<10μS/cm"
        range: "0-50μS/cm"
        control: "监控报警"
      - name: "UV功率"
        value: "40W"
        control: "监控"
      - name: "反洗压差"
        value: "<0.05MPa"
        range: "0-0.2MPa"
        control: "自动触发"
    backwash:
      media_filter:
        trigger: "压差>0.08MPa 或 运行8h"
      carbon_filter:
        trigger: "压差>0.06MPa 或 运行24h"
      ro_membrane:
        trigger: "产水电导率>10μS/cm 或 运行72h"
  TH:
    name: "茶叶前处理"
    equipment: "投料仓+粉碎机+磁选器+计量仓+输送绞龙"
    capacity: "200kg/h"
    params:
      - name: "粉碎粒度"
        value: "80-100目"
        range: "60-120目"
        control: "变频控制"
      - name: "粉碎能力"
        value: "200kg/h"
        range: "50-250kg/h"
        control: "变频控制"
      - name: "除尘负压"
        value: "-2kPa"
        range: "-3~-1kPa"
        control: "PID控制"
      - name: "粉尘浓度"
        value: "<50%LEL"
        range: "0-100%LEL"
        control: "联锁控制"
      - name: "金属检出灵敏度"
        value: "φ1.5mm Fe"
        control: "剔除控制"
  EX:
    name: "萃取系统"
    equipment: "三级逆流萃取罐×3+茶渣分离+冷却"
    batch_size: "2000L"
    params:
      - name: "萃取级数"
        value: "3级"
        control: "批次控制"
      - name: "萃取温度"
        value: "85±2℃"
        control: "PID控制"
      - name: "萃取时间"
        value: "15min"
        control: "时间控制"
      - name: "搅拌速度"
        value: "50rpm"
        range: "50-80rpm"
        control: "变频控制"
      - name: "批次产量"
        value: "1600-1800L"
        control: "累计计量"
  FL:
    name: "过滤净化"
    equipment: "碟式离心机+超滤膜"
    capacity: "5000L/h"
    params:
      - name: "进料温度"
        value: "50℃"
        range: "45-55℃"
        control: "PID控制"
      - name: "过滤压力"
        value: "0.2-0.4MPa"
        range: "0-1MPa"
        control: "PID控制"
      - name: "过滤流量"
        value: "5000L/h"
        range: "0-10000L/h"
        control: "流量控制"
      - name: "碟式离心机转速"
        value: "7500rpm"
        range: "7000-8500rpm"
        control: "变频控制"
  BL:
    name: "调配系统"
    equipment: "调配罐BL-101+BL-102+糖浆罐+酸液罐+香料罐"
    batch_size: "2000L"
    params:
      - name: "调配温度"
        value: "25℃"
        range: "20-30℃"
        tolerance: "±5℃"
      - name: "目标Brix"
        value: "10°Bx"
        range: "8-12°Bx"
        tolerance: "±2°Bx"
        control: "自动调节"
      - name: "目标pH"
        value: "5.5"
        range: "5.0-6.0"
        tolerance: "±0.5"
        control: "自动调节"
      - name: "糖浆浓度"
        value: "65°Bx"
        range: "62-68°Bx"
        tolerance: "±2°Bx"
      - name: "酸液浓度"
        value: "2%"
        range: "1.5-2.5%"
        tolerance: "±0.2%"
      - name: "搅拌时间"
        value: "15min"
        range: "10-20min"
        tolerance: "±30s"
  HM:
    name: "均质系统"
    equipment: "预热器+均质机+冷却器"
    capacity: "3000L/h"
    params:
      - name: "均质压力"
        value: "25MPa"
        range: "18-27MPa"
        control: "PID控制"
      - name: "进料温度"
        value: "65℃"
        range: "55-75℃"
        control: "PID控制"
      - name: "出料温度"
        value: "<70℃"
        range: "0-100℃"
        control: "监控报警"
      - name: "处理流量"
        value: "3000L/h"
        range: "0-5000L/h"
        control: "监控"
  UH:
    name: "UHT杀菌"
    equipment: "预热段+杀菌段+保温段+冷却段+无菌储罐"
    capacity: "3000L/h"
    is_ccp: true
    params:
      - name: "预热段温度"
        value: "80℃"
        range: "75-85℃"
        control: "PID"
        alarm: "L:75℃, H:85℃"
      - name: "杀菌段温度[CCP1]"
        value: "135℃"
        range: "130-137℃"
        control: "PID"
        alarm: "L:127℃关阀"
        interlock: "立即关闭进料阀"
      - name: "保温段时间[CCP2]"
        value: "≥15s"
        range: "≥13s"
        control: "时间累积"
        alarm: "<13s隔离"
      - name: "F₀值[CCP3]"
        value: "≥6.0"
        range: "≥6.0"
        control: "积分计算"
        alarm: "<6.0隔离"
      - name: "冷却段出口温度"
        value: "25℃"
        range: "20-35℃"
        control: "监控"
        alarm: "H:35℃"
      - name: "杀菌压力"
        value: "0.35MPa"
        range: "0.2-0.5MPa"
        control: "PID"
      - name: "产品流量"
        value: "3000L/h"
        range: "2500-3500L/h"
        control: "PID"
  PF:
    name: "无菌灌装"
    equipment: "72头旋转式无菌灌装机"
    capacity: "54000B/h"
    is_high_speed: true
    params:
      - name: "灌装速度"
        value: "54000B/H"
        range: "30000-54000B/H"
        tolerance: "±3%"
      - name: "灌装温度"
        value: "25-30℃"
        range: "25-35℃"
        tolerance: "±5℃"
      - name: "灌装容量"
        value: "500ml"
        range: "485-515ml"
        tolerance: "±1.5%"
      - name: "灌装周期"
        value: "66.7ms"
        range: "66.7-120ms"
        tolerance: "±0.5ms"
      - name: "同步偏差"
        value: "<1ms"
        range: "0-3ms"
        tolerance: "±1ms"
  CG:
    name: "旋盖系统"
    equipment: "旋盖机"
    capacity: "54000B/h"
    params:
      - name: "旋盖扭矩"
        value: "0.5Nm"
        range: "0.3-0.7Nm"
        tolerance: "±0.05Nm"
      - name: "旋盖速度"
        value: "54000B/H"
        range: "50000-58000B/H"
        tolerance: "±3%"
      - name: "瓶盖消毒温度"
        value: "≥60℃"
        control: "监控"
  CP:
    name: "CIP清洗站"
    equipment: "CIP酸罐+碱罐+热水罐+供给泵+返回泵+计量系统"
    capacity: "20m³/h"
    params:
      - name: "碱液浓度"
        value: "2%"
        range: "1.5-2.5%"
        control: "电导率监控"
      - name: "酸液浓度"
        value: "1%"
        range: "0.8-1.5%"
        control: "电导率监控"
      - name: "清洗温度"
        value: "85℃"
        range: "80-90℃"
        control: "PID控制"
      - name: "供给压力"
        value: "0.4MPa"
        range: "0.3-0.5MPa"
        control: "压力控制"
      - name: "供给流量"
        value: "20m³/h"
        range: "0-20m³/h"
        control: "流量控制"
  PK:
    name: "膜包码垛"
    equipment: "膜包机+机器人码垛+输送系统"
    capacity: "60包/min"
    params:
      - name: "膜包速度"
        value: "60包/min"
        range: "50-70包/min"
        control: "变频控制"
      - name: "膜宽"
        value: "450mm"
        range: "400-500mm"
        control: "调节"
      - name: "裹膜张力"
        value: "50N"
        range: "40-60N"
        control: "张力控制"
      - name: "封口温度"
        value: "180℃"
        range: "170-190℃"
        control: "温度控制"
      - name: "码垛层数"
        value: "5层"
        range: "1-6层"
        control: "计数控制"

# ============================================================================
# ccp_config - 从 system_config.yaml 移入
# ============================================================================
ccp_config:
  CCP1:
    section: "UH"
    name: "UHT杀菌温度"
    parameter: "温度"
    setpoint: "135℃"
    range: "130-137℃"
    critical_limit: "127℃"
    response_time_ms: 10
    action: "立即关闭进料阀"
    verification: "温度记录仪连续记录"
  CCP2:
    section: "UH"
    name: "UHT保温时间"
    parameter: "时间"
    setpoint: "≥15s"
    critical_limit: "13s"
    response_time_ms: 100
    action: "延长保温或隔离产品"
    verification: "时间累积记录"
  CCP3:
    section: "UH"
    name: "UHT F₀值"
    parameter: "灭菌效能"
    setpoint: "≥6.0"
    critical_limit: "6.0"
    response_time_ms: 100
    action: "产品隔离，报警"
    verification: "积分计算连续监控"
  CCP4:
    section: "BL"
    name: "调配Brix"
    parameter: "糖度"
    setpoint: "10°Bx"
    range: "8-12°Bx"
    critical_limit: "8/12°Bx"
    response_time_ms: 30000
    action: "调整糖浆添加量"
  CCP5:
    section: "BL"
    name: "调配pH"
    parameter: "酸度"
    setpoint: "5.5"
    range: "5.0-6.0"
    critical_limit: "5.0/6.0"
    response_time_ms: 30000
    action: "调整酸液添加量"

# ============================================================================
# cip_program - 从 system_config.yaml 移入
# ============================================================================
cip_program:
  standard_5step:
    - step: 1
      name: "预冲洗"
      medium: "纯水"
      temp: "85℃"
      time: "15min"
      concentration: "-"
      purpose: "去除残留产品"
    - step: 2
      name: "碱洗"
      medium: "NaOH"
      temp: "85℃"
      time: "30min"
      concentration: "1.5-2.0%"
      purpose: "溶解有机物"
    - step: 3
      name: "中间冲洗"
      medium: "纯水"
      temp: "常温"
      time: "10min"
      concentration: "-"
      purpose: "冲洗碱液"
    - step: 4
      name: "酸洗"
      medium: "HNO₃"
      temp: "60℃"
      time: "20min"
      concentration: "0.8-1.5%"
      purpose: "去除无机物"
    - step: 5
      name: "最终冲洗"
      medium: "纯水"
      temp: "常温"
      time: "10min"
      concentration: "pH 6.5-7.0"
      purpose: "中和+检测"
  system:
    stations:
      - id: "CP-101"
        name: "CIP碱液罐"
        volume_m3: 2
        tank_type: "SS304"
        chemical: "NaOH"
        concentration_default: 2
        concentration_range: [1.5, 2.5]
        temp_default: 85
        temp_range: [80, 90]
      - id: "CP-102"
        name: "CIP酸液罐"
        volume_m3: 1
        tank_type: "SS304"
        chemical: "HNO₃"
        concentration_default: 1
        concentration_range: [0.8, 1.5]
        temp_default: 60
        temp_range: [55, 65]
      - id: "CP-103"
        name: "CIP热水罐"
        volume_m3: 3
        tank_type: "SS304"
        temp_default: 85
        temp_range: [80, 90]
    pumps:
      - id: "P-CP01"
        name: "CIP清洗泵1"
        flow_m3_h: 5
        is_inverter: true
      - id: "P-CP02"
        name: "CIP清洗泵2"
        flow_m3_h: 5
        is_inverter: true
  cleaning_agents:
    NaOH:
      name: "氢氧化钠(碱)"
      concentration_default: 2
      concentration_unit: "%"
      temp_default: 85
      time_default: 30
      unit: "min"
      applicable: "所有不锈钢设备"
    HNO3:
      name: "硝酸(酸)"
      concentration_default: 1
      concentration_unit: "%"
      temp_default: 60
      time_default: 20
      unit: "min"
      applicable: "所有不锈钢设备"
    热水:
      name: "热水"
      temp_default: 85
      time_default: 15
      unit: "min"
      applicable: "最终冲洗"
    纯水:
      name: "纯水"
      temp_default: "常温"
      time_default: 10
      unit: "min"
      applicable: "最终冲洗"
    H2O2:
      name: "过氧化氢(消毒)"
      concentration_default: 0.5
      concentration_unit: "%"
      temp_default: "常温"
      time_default: 10
      unit: "min"
      applicable: "消毒处理"
  zones:
    A:
      name: "A区"
      description: "水处理系统"
      section_codes: ["WT"]
      target_devices: ["原水箱、管道、过滤器(不含RO膜)、纯水储罐"]
      cip_program: "CIP-WT"
      frequency: "每日生产前"
    B:
      name: "B区"
      description: "茶叶前处理+萃取"
      section_codes: ["TH", "EX"]
      target_devices: ["茶叶储罐、粉碎机、萃取罐、茶渣分离器、冷却器、萃取液储罐"]
      cip_program: "CIP-EX"
      frequency: "每批次后"
    C:
      name: "C区"
      description: "过滤系统"
      section_codes: ["FL"]
      target_devices: ["碟式离心机、超滤膜组件、超滤循环泵、膜清洗罐"]
      cip_program: "CIP-FL"
      frequency: "每批次过滤完成后"
    D:
      name: "D区"
      description: "调配系统"
      section_codes: ["BL"]
      target_devices: ["调配罐、糖浆罐、酸液罐、香料罐、计量罐、管道"]
      cip_program: "CIP-BL"
      frequency: "每批次调配完成后"
    E:
      name: "E区"
      description: "UHT系统"
      section_codes: ["UH"]
      target_devices: ["UHT杀菌锅、预热器、保温管、冷却器、无菌储罐"]
      cip_program: "CIP-UH"
      frequency: "每48小时"
    F:
      name: "F区"
      description: "灌装系统"
      section_codes: ["PF"]
      target_devices: ["吹灌一体机、旋盖机、管道"]
      cip_program: "CIP-PF"
      frequency: "每12小时"
  programs:
    CIP-WT:
      name: "水处理系统清洗"
      zone: "A"
      description: "原水箱、管道、过滤器(不含RO膜)、纯水储罐"
      trigger_conditions:
        - "每日生产前"
        - "停产超过48小时"
        - "水质检测不合格"
      steps:
        - step: 1
          name: "预冲洗"
          medium: "原水"
          temp: "常温"
          time_min: 10
          flow_m3_h: 3
          drain: true
          standard: "冲水清澈"
        - step: 2
          name: "碱洗"
          medium: "2% NaOH"
          temp: 85
          time_min: 20
          flow_m3_h: 3
          drain: false
          circulation: true
          standard: "回水电导率稳定"
        - step: 3
          name: "中间冲洗"
          medium: "原水"
          temp: "常温"
          time_min: 10
          flow_m3_h: 3
          drain: true
          standard: "pH<8.5"
        - step: 4
          name: "酸洗"
          medium: "1% HNO₃"
          temp: 60
          time_min: 15
          flow_m3_h: 3
          drain: false
          circulation: true
          standard: "回水电导率稳定"
        - step: 5
          name: "最终冲洗"
          medium: "纯水"
          temp: "常温"
          time_min: 10
          flow_m3_h: 3
          drain: true
          standard: "电导率<50μS/cm"
      notes:
        - "RO膜组件不参与清洗，需单独处理"
        - "UV灯管需拆下后才能清洗"
    CIP-EX:
      name: "茶叶前处理+萃取系统清洗"
      zone: "B"
      description: "茶叶储罐、粉碎机、萃取罐、茶渣分离器、冷却器、萃取液储罐"
      trigger_conditions:
        - "每批次茶叶用完"
        - "停产超过24小时"
        - "产品切换（绿茶↔红茶↔乌龙茶）"
      steps:
        - step: 1
          name: "预冲洗"
          medium: "纯水"
          temp: 50
          time_min: 15
          flow_m3_h: 2
          drain: true
          standard: "冲水无茶渣"
        - step: 2
          name: "碱洗"
          medium: "2% NaOH"
          temp: 85
          time_min: 30
          flow_m3_h: 2
          drain: false
          circulation: true
          standard: "回水电导率稳定"
        - step: 3
          name: "中间冲洗"
          medium: "纯水"
          temp: 60
          time_min: 15
          flow_m3_h: 2
          drain: true
          standard: "pH<8.5"
        - step: 4
          name: "酸洗"
          medium: "1% HNO₃"
          temp: 60
          time_min: 20
          flow_m3_h: 2
          drain: false
          circulation: true
          standard: "回水电导率稳定"
        - step: 5
          name: "最终冲洗"
          medium: "纯水"
          temp: "常温"
          time_min: 10
          flow_m3_h: 2
          drain: true
          standard: "电导率<50μS/cm"
      notes:
        - "茶叶储罐需人工清理残余茶叶后再启动CIP"
        - "萃取罐内部冲洗球必须全部动作"
        - "清洗完成后打开EX-106检查内部清洁度"
    CIP-FL:
      name: "膜过滤系统清洗"
      zone: "C"
      description: "碟式离心机、超滤膜组件、超滤循环泵、膜清洗罐"
      trigger_conditions:
        - "每批次过滤完成后"
        - "膜压差超过0.15MPa"
        - "停产超过24小时"
        - "每日待机前"
      steps:
        - step: 1
          name: "顶料"
          medium: "纯水"
          temp: "常温"
          time_min: 10
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "产品完全顶出"
        - step: 2
          name: "反冲洗"
          medium: "纯水"
          temp: 50
          time_min: 15
          flow_m3_h: 3
          pressure_max: 0.3
          standard: "出水清澈"
        - step: 3
          name: "碱洗"
          medium: "2% NaOH"
          temp: 45
          time_min: 30
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "回水电导稳定"
        - step: 4
          name: "冲洗"
          medium: "纯水"
          temp: "常温"
          time_min: 10
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "pH<8.5"
        - step: 5
          name: "酸洗"
          medium: "1% HNO₃"
          temp: 35
          time_min: 20
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "回水电导稳定"
        - step: 6
          name: "冲洗"
          medium: "纯水"
          temp: "常温"
          time_min: 15
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "电导率<50μS/cm"
        - step: 7
          name: "膜完整性测试"
          medium: "纯水"
          temp: "常温"
          pressure_test: 0.2
          standard: "压降<10%"
      enhanced_cleaning:
        frequency: "每72小时"
        steps:
          - step: "CIP-1"
            medium: "NaOH 1%"
            temp: 45
            time_min: 30
            note: "去除有机物"
          - step: "CIP-2"
            medium: "纯水"
            temp: "常温"
            time_min: 10
            note: "冲洗"
          - step: "CIP-3"
            medium: "HNO₃ 0.5%"
            temp: 35
            time_min: 30
            note: "去除无机物"
          - step: "CIP-4"
            medium: "纯水"
            temp: "常温"
            time_min: 15
            note: "冲洗至中性"
    CIP-BL:
      name: "调配系统清洗"
      zone: "D"
      description: "调配罐、糖浆罐、酸液罐、香料罐、计量罐、管道"
      trigger_conditions:
        - "每批次调配完成后"
        - "产品切换"
        - "停产超过24小时"
      steps:
        - step: 1
          name: "预冲洗"
          medium: "纯水"
          temp: 40
          time_min: 10
          flow_m3_h: 2
          agitation: "低速"
          standard: "无残留糖液"
        - step: 2
          name: "碱洗"
          medium: "2% NaOH"
          temp: 85
          time_min: 30
          flow_m3_h: 2
          agitation: "低速"
          standard: "回水电导稳定"
        - step: 3
          name: "冲洗"
          medium: "纯水"
          temp: 50
          time_min: 15
          flow_m3_h: 2
          agitation: "低速"
          standard: "pH<8.5"
        - step: 4
          name: "酸洗"
          medium: "1% HNO₃"
          temp: 60
          time_min: 20
          flow_m3_h: 2
          agitation: "低速"
          standard: "回水电导稳定"
        - step: 5
          name: "最终冲洗"
          medium: "纯水"
          temp: "常温"
          time_min: 15
          flow_m3_h: 2
          standard: "电导率<50μS/cm"
        - step: 6
          name: "消毒"
          medium: "0.5% H₂O₂"
          temp: "常温"
          time_min: 10
          standard: "无残留"
      notes:
        - "糖浆罐BL-103使用前需用85℃热水溶解残留糖"
        - "酸液罐BL-104需单独酸洗，避免与碱液混合"
    CIP-UH:
      name: "UHT杀菌系统清洗"
      zone: "E"
      description: "UHT杀菌锅、预热器、保温管、冷却器、无菌储罐"
      trigger_conditions:
        - "每48小时"
        - "停产超过12小时"
        - "产品切换"
        - "微生物检测不合格"
      steps:
        - step: 1
          name: "纯水顶料"
          medium: "纯水"
          temp: "常温"
          time_min: 5
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "产品完全顶出"
        - step: 2
          name: "碱洗"
          medium: "2% NaOH"
          temp: 85
          time_min: 45
          flow_m3_h: 2
          pressure_range: [0.3, 0.5]
          standard: "回流温度>80℃"
        - step: 3
          name: "纯水冲洗"
          medium: "纯水"
          temp: 70
          time_min: 15
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "pH<8.5"
        - step: 4
          name: "酸洗"
          medium: "1% HNO₃"
          temp: 60
          time_min: 30
          flow_m3_h: 2
          pressure_range: [0.3, 0.5]
          standard: "回流温度>55℃"
        - step: 5
          name: "纯水冲洗"
          medium: "纯水"
          temp: "常温"
          time_min: 15
          flow_m3_h: 2
          pressure_max: 0.3
          standard: "电导率<50μS/cm"
        - step: 6
          name: "无菌验证"
          medium: "-"
          standard: "无菌培养48h"
      notes:
        - "清洗过程中保温管必须保持满管状态"
        - "无菌储罐清洗后需充无菌空气保持正压"
        - "清洗完成后需进行无菌验证"
    CIP-PF:
      name: "灌装系统清洗"
      zone: "F"
      description: "吹灌一体机、旋盖机、管道"
