# ============================================================================
# 中断组织块配置模板
# ============================================================================
ob_config:
  OB1:
    type: "Free Cycle"
    cycle_ms: 100
    applies_to: "ALL"
    desc: "主程序循环"
  OB30:
    type: "Cyclic Interrupt"
    cycle_ms: 50
    applies_to: ["PLC-5", "PLC-7", "PLC-9"]
    desc: "快速液位/温度控制"
  OB32:
    type: "Cyclic Interrupt"
    cycle_ms: 50
    applies_to: ["PLC-3", "PLC-4", "PLC-6", "PLC-15"]
    desc: "快速液位/温度控制"
  OB34:
    type: "Cyclic Interrupt"
    cycle_ms: 10
    applies_to: ["PLC-8", "PLC-9", "PLC-10"]
    desc: "高速同步控制"
  OB35:
    type: "Cyclic Interrupt"
    cycle_ms: 100
    applies_to: ["PLC-1", "PLC-2", "PLC-11", "PLC-12", "PLC-13", "PLC-14"]
    desc: "标准控制"
  OB80:
    type: "Time Error"
    applies_to: ["PLC-7", "PLC-9"]
    desc: "同步超时处理"
  OB82:
    type: "Diagnostic Interrupt"
    applies_to: "ALL"
    desc: "诊断中断"
  OB100:
    type: "Startup"
    applies_to: "ALL"
    desc: "启动组织块"

