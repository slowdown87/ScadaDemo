# ============================================================================
# CIP清洗程序
# ============================================================================
cip_program:
  standard_5step:
    - step: 1
      name: "预冲洗"
      medium: "纯水"
      temp: "85℃"
      time: "15min"
      concentration: "-"
      purpose: "去除残留产品"
    - step: 2
      name: "碱洗"
      medium: "NaOH"
      temp: "85℃"
      time: "30min"
      concentration: "1.5-2.0%"
      purpose: "溶解有机物"
    - step: 3
      name: "中间冲洗"
      medium: "纯水"
      temp: "常温"
      time: "10min"
      concentration: "-"
      purpose: "冲洗碱液"
    - step: 4
      name: "酸洗"
      medium: "HNO₃"
      temp: "60℃"
      time: "20min"
      concentration: "0.8-1.5%"
      purpose: "去除无机物"
    - step: 5
      name: "最终冲洗"
      medium: "纯水"
      temp: "常温"
      time: "10min"
      concentration: "pH 6.5-7.0"
      purpose: "中和+检测"
  environment_requirements:
    aseptic_area:
      cleanliness: "10万级正压"
      temp: "20-25℃"
      humidity: "≤60%"
      pressure: "≥10Pa正压"
    blending_area:
      cleanliness: "30万级"
      temp: "20-25℃"
      humidity: "≤65%"
      pressure: "正压"
    extraction_area:
      cleanliness: "30万级"
      temp: "20-25℃"
      humidity: "≤65%"
      pressure: "正压"
    general_area:
      cleanliness: "普通"
      temp: "20-28℃"
      humidity: "≤75%"

