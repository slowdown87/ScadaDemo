    Kp: 2.5
    Ti: 60
    Td: 10
    cycle_ms: 100
    note: "蒸汽调节"
  pressure_loop:
    Kp: 2.0
    Ti: 20
    Td: 5
    cycle_ms: 50
    note: "高压调节阀"
  flow_loop:
    Kp: 2.0
    Ti: 20
    Td: 3
    cycle_ms: 50
    note: "变频泵控制"
  level_loop:
    Kp: 1.5
    Ti: 60
    Td: 10
    cycle_ms: 500
    note: "液位PID"
  brix_loop:
    Kp: 1.5
    Ti: 45
    Td: 5
    cycle_ms: 100
    note: "串级主控"
  ph_loop:
    Kp: 2.0
    Ti: 30
    Td: 8
    cycle_ms: 100
    note: "非线性控制"

# ============================================================================
# 联锁模板
# ============================================================================
interlock_templates:
  temperature_ll:
    action: "关闭进料阀/停止加热"
    delay_ms: 0
  temperature_hh:
    action: "关闭进料阀/停止加热"
    delay_ms: 0
  pressure_ll:
    action: "报警提示"
    delay_ms: 0
  pressure_hh:
    action: "停机保护"
    delay_ms: 0
  level_ll:
    action: "停止泵/关闭进料"
    delay_ms: 0
  level_hh:
    action: "关闭进料阀"
    delay_ms: 0
  flow_ll:
    action: "报警提示"
    delay_ms: 1000
  conductivity_hh:
    action: "产品隔离/报警"
    delay_ms: 0

# ============================================================================
# CCP联锁详细配置
# ============================================================================
ccp_interlocks:
  UH_TT2_127:
    sensor: "TT2-杀菌段温度"
    condition: "<127℃ 持续10ms"
    action: "立即关闭进料阀"
    delay_ms: 10
    priority: "P0-安全联锁"
  UH_F0_below6:
    sensor: "F0值计算"
    condition: "<6.0"
    action: "产品隔离"
    delay_ms: 100
    priority: "P0-食品安全"
  BL_AT_range:
    sensor: "AT-pH值"
    condition: "超出3.5-4.0范围"
    action: "调整酸液添加量"
    delay_ms: 30000
    priority: "P1-品质控制"
  BL_BT_range:
    sensor: "BT-Brix值"
    condition: "超出5.0-6.0°Bx范围"
    action: "调整糖浆添加量"
    delay_ms: 30000
    priority: "P1-品质控制"
  CG_TT_torque:
    sensor: "TT-扭矩"
    condition: "<0.25Nm 或 >0.8Nm"
    action: "停机+剔除"
    delay_ms: 0
    priority: "P0-安全联锁"

