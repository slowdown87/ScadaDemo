# ============================================================================
# 设备清单
# ============================================================================
devices:
  WT:
    - id: "WT-101"
      name: "原水箱"
      type: "tank"
      supplier: "国产"
      spec: "SS304, 10m³, Φ2000×3500mm"
      quantity: 1
      sensors:
        - code: "LT"
          name: "液位"
