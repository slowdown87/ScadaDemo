io_summary:
  total_estimated: 2050
  liquid_line: 1180
  packaging_line: 730
  independent: 140

# ============================================================================
# 产品配方参数
# ============================================================================
product_recipe:
  tea_types:
    green_tea:
      name: "绿茶"
      water_temp: "80-85℃"
      tea_water_ratio: "1:12-1:15"
      extraction_time: "15min"
      tea_polyphenol: "≥300mg/kg"
    black_tea:
      name: "红茶"
      water_temp: "90-95℃"
      tea_water_ratio: "1:10-1:12"
      extraction_time: "20min"
      tea_polyphenol: "≥150mg/kg"
    oolong_tea:
      name: "乌龙茶"
      water_temp: "85-90℃"
      tea_water_ratio: "1:10-1:15"
      extraction_time: "18min"
      tea_polyphenol: "≥200mg/kg"
  unified_quality:
    final_ph: 3.8
    ph_range: "3.5-4.0"
    final_brix: 5.5
    brix_range: "5.0-6.0°Bx"
    fill_temp: "25-30℃"
    fill_temp_range: "25-35℃"
    fill_capacity: "500ml"
    fill_tolerance: "±1.5%"

# ============================================================================
# 各工段工艺参数
# ============================================================================
process_params:
  WT:
    name: "水处理系统"
    equipment: "多介质过滤器+活性炭+RO+离子交换+UV"
    batch_size: "10m³"
    capacity: "5m³/h"
    params:
      - name: "RO产水量"
        value: "5m³/h"
        range: "0-10m³/h"
        control: "PID控制"
      - name: "RO前压力"
        value: "0.6-0.8MPa"
        range: "0-1MPa"
        control: "PID控制"
      - name: "产水电导率"
        value: "<10μS/cm"
        range: "0-50μS/cm"
        control: "监控报警"
      - name: "UV功率"
        value: "40W"
        control: "监控"
      - name: "反洗压差"
        value: "<0.05MPa"
        range: "0-0.2MPa"
        control: "自动触发"
    backwash:
      media_filter:
        trigger: "压差>0.08MPa 或 运行8h"
      carbon_filter:
        trigger: "压差>0.06MPa 或 运行24h"
      ro_membrane:
