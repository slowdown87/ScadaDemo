# 萃取系统 (EX) 设备清单
# 工段: EX, PLC: PLC-3, IP: 192.168.1.13

devices_ex:
  - id: "EX-101"
    name: "萃取罐1"
    type: tank
    section: EX
    model: "ET-2000"
    spec: "2m³, 夹套加热, 温度95℃"
    quantity: 1
    supplier: "国产"
    sensors:
      - code: "LT"
        name: "液位"
        type: "液位计"
        range: [0, 100]
        unit: "%"
        alarm: {H: 95}
      - code: "TT"
        name: "萃取罐1温度"
        type: "温度计"
        range: [0, 120]
        unit: "℃"
        alarm: {L: 75, H: 100}
        is_key_point: true
      - code: "FT"
        name: "萃取罐1进水量"
        type: "流量计"
        range: [0, 5]
        unit: "m³/h"
      - code: "MT"
        name: "萃取罐1搅拌电机温度"
        type: "温度计"
        range: [0, 150]
        unit: "℃"
        alarm: {H: 120}
    valves:
      - id: "EV-101"
        name: "萃取罐1进水阀"
        type: "气动调节阀"
        control: "自动/PID"
      - id: "EV-103"
        name: "萃取罐1进茶阀"
        type: "气动阀"
        control: "自动"
    motors:
      - id: "M-EX01"
        name: "萃取罐1搅拌"
        power_kw: 3.0
        is_inverter: true

