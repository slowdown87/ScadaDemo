# ============================================================================
# 工段定义
# 说明: 共16个工段，分配到16个独立PLC
# 流程顺序: WT→TH→EX→FL→BL→HM→UH→BF→PF→CG→LI→CI→LB→CA→PK→CP
# ============================================================================
sections:
  WT:
    name: "水处理系统"
    name_en: "Water Treatment"
    prefix: "WT"
    number_range: [101, 199]
    plc: "PLC-1"
    plc_ip: "192.168.2.11"
  TH:
    name: "茶叶前处理系统"
    name_en: "Tea Handling"
    prefix: "TH"
    number_range: [201, 299]
    plc: "PLC-2"
    plc_ip: "192.168.2.12"
  EX:
    name: "萃取系统"
    name_en: "Extraction"
    prefix: "EX"
    number_range: [301, 399]
    plc: "PLC-3"
