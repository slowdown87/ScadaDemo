# 均质系统 (HM) 设备清单
# 工段: HM, PLC: PLC-6, IP: 192.168.2.16

devices_hm:
  - id: "HM-101"
    name: "高压均质机"
    type: uht
    section: HM
    model: "GYB-3000"
    spec: "20-25MPa, 3000L/h"
    quantity: 1
    supplier: "进口"
    power_kw: 75
    is_inverter: false
    sensors:
      - code: "PT"
        name: "均质进口压力"
        type: "压力计"
        range: [0, 1]
        unit: "MPa"
        alarm: {H: 0.8}
      - code: "PT2"
        name: "均质工作压力"
        type: "压力计"
        range: [0, 40]
        unit: "MPa"
        alarm: {L: 18, H: 27}
        is_key_point: true
      - code: "TT"
        name: "均质进口温度"
        type: "温度计"
        range: [0, 100]
        unit: "℃"
        alarm: {L: 55, H: 75}
      - code: "FT"
        name: "均质流量"
        type: "流量计"
        range: [0, 5]
        unit: "m³/h"
        alarm: {L: 2.5}
      - code: "MT"
        name: "均质机电机温度"
        type: "温度计"
        range: [0, 150]
        unit: "℃"
        alarm: {H: 130}
      - code: "ST"
        name: "均质机转速"
        type: "转速计"
        range: [0, 5000]
        unit: "rpm"
      - code: "TT2"
        name: "均质阀温度"
        type: "温度计"
        range: [0, 150]
        unit: "℃"
        alarm: {H: 140}
    valves:
      - id: "BV-107"
        name: "均质机进口阀"
        type: "气动阀"
        control: "均质启动"
      - id: "BV-108"
        name: "均质机出口阀"
        type: "气动阀"
        control: "均质启动"
    motors:
      - id: "M-HM01"
        name: "均质机电机"
        power_kw: 75
        is_inverter: false

  - id: "HM-102"
    name: "均质阀组"
    type: valve
    section: HM
    model: "原厂配件"
    spec: "动静阀, 碳化钨材质"
    quantity: 2
    supplier: "进口"

  - id: "HM-103"
    name: "均质压力传感器"
    type: sensor
    section: HM
    model: "0-40MPa"
    spec: "精度0.5级"
    quantity: 1
    supplier: "进口"
    sensors:
      - code: "PT"
        name: "均质压力"
        type: "压力计"
        range: [0, 40]
        unit: "MPa"
