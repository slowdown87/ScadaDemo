# 过滤净化系统 (FL) 设备清单
# 工段: FL, PLC: PLC-4, IP: 192.168.2.14

devices_fl:
  - id: "FL-101"
    name: "碟式离心机"
    type: motor
    section: FL
    model: "DF-616"
    spec: "6000L/h, 分离因数9000"
    quantity: 1
    supplier: "国产"
    power_kw: 15
    is_inverter: true
    sensors:
      - code: "PT"
        name: "碟式离心机进口压力"
        type: "压力计"
        range: [0, 0.3]
        unit: "MPa"
        alarm: {H: 0.25}
      - code: "ST"
        name: "碟式离心机转速"
        type: "转速计"
        range: [0, 10000]
        unit: "rpm"
        alarm: {L: 5000, H: 7000}
      - code: "MT"
        name: "碟式离心机电机温度"
        type: "温度计"
        range: [0, 120]
        unit: "℃"
        alarm: {H: 100}
    motors:
      - id: "M-FL01"
        name: "碟式离心机电机"
        power_kw: 15
        is_inverter: true

  - id: "FL-102"
    name: "超滤膜组件"
    type: filter
    section: FL
    model: "UF-0.1μm"
    spec: "陶瓷膜, 0.1μm孔径, 6000L/h"
    quantity: 1
    supplier: "进口"
    sensors:
      - code: "PT"
        name: "超滤进口压力"
        type: "压力计"
        range: [0, 0.4]
        unit: "MPa"
        alarm: {H: 0.35}
      - code: "PT2"
        name: "超滤出口压力"
        type: "压力计"
        range: [0, 0.3]
        unit: "MPa"
        alarm: {H: 0.25}
      - code: "DPT"
        name: "超滤膜压差"
        type: "差压计"
        range: [0, 0.2]
        unit: "MPa"
        alarm: {H: 0.15}
        note: "膜污染判断"
      - code: "FT"
        name: "超滤产水流量"
        type: "流量计"
        range: [0, 6]
        unit: "m³/h"
        alarm: {L: 4}
      - code: "FT2"
        name: "超滤浓水流量"
        type: "流量计"
        range: [0, 2]
        unit: "m³/h"
        alarm: {L: 0.5}
        note: "反洗监控"
      - code: "TT"
        name: "超滤进口温度"
        type: "温度计"
        range: [0, 80]
        unit: "℃"
        alarm: {L: 55, H: 75}
        note: "膜工作温度"

  - id: "FL-103"
    name: "超滤循环泵"
    type: pump
    section: FL
    model: "卫生级离心泵"
    spec: "8m³/h, SS316"
    quantity: 1
    supplier: "国产"
    power_kw: 5.5
    is_inverter: true
    sensors:
      - code: "PT"
        name: "超滤循环泵出口压力"
        type: "压力计"
        range: [0, 0.6]
        unit: "MPa"
        alarm: {H: 0.5}
      - code: "FT"
        name: "超滤循环流量"
        type: "流量计"
        range: [0, 8]
        unit: "m³/h"
        alarm: {L: 6}

  - id: "FL-104"
    name: "膜组件清洗罐"
    type: tank
    section: FL
    model: "SS304, 1m³"
    spec: "CIP清洗用"
    quantity: 1
    supplier: "国产"
    sensors: []
