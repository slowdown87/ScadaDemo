# 灌装系统 (PF) 设备清单
# 工段: PF, PLC: PLC-8, IP: 192.168.1.18

devices_pf:
  - id: "PF-101"
    name: "吹灌一体机"
    type: filler
    section: PF
    model: "SBL-FG54000"
    spec: "54000B/H, 一步法吹瓶+72头灌装"
    quantity: 1
    supplier: "进口"
    sensors:
      - code: "ST"
        name: "灌装机速度"
        type: "编码器"
        range: [0, 60000]
        unit: "瓶/h"
        alarm: {L: 50000, H: 58000}
      - code: "TT"
        name: "灌装温度"
        type: "温度计"
        range: [0, 100]
        unit: "℃"
        alarm: {L: 80, H: 92}
        is_key_point: true
      - code: "LT"
        name: "灌装液位"
        type: "液位计"
        range: [0, 100]
        unit: "%"
        alarm: {L: 50}
      - code: "PT"
        name: "灌装背压"
        type: "压力计"
        range: [0, 0.5]
        unit: "MPa"
        alarm: {H: 0.3}
    motors:
      - id: "M-PF01"
        name: "灌装机主电机"
        power_kw: 30
        is_inverter: true

  - id: "PF-102"
    name: "瓶盖消毒器"
    type: heat_exchanger
    section: PF
    model: "CD-200"
    spec: "UV+酒精消毒"
    quantity: 1
    supplier: "国产"
    sensors:
      - code: "TT"
        name: "消毒温度"
        type: "温度计"
        range: [0, 100]
        unit: "℃"
        alarm: {L: 60}

  - id: "PF-103"
    name: "金属检测机"
    type: packaging
    section: PF
    model: "MD-6300"
    spec: "灵敏度φ0.8mm Fe"
    quantity: 1
    supplier: "进口"
    sensors:
      - code: "DT"
        name: "金属检测机状态"
        type: "状态"
        alarm_action: "报警时停线"

  - id: "PF-104"
    name: "漏堵检测器"
    type: packaging
    section: PF
    model: "LD-100"
    spec: "红外检测"
    quantity: 1
    supplier: "国产"
    sensors:
      - code: "DT"
        name: "漏堵检测器状态"
        type: "状态"
        alarm_action: "报警时停线"
