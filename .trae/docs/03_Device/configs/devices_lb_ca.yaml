# 贴标系统 (LB) + 装箱系统 (CA) 设备清单
# LB工段: PLC-12, IP: 192.168.2.22
# CA工段: PLC-13, IP: 192.168.2.23

devices_lb:
  - id: "LB-101"
    name: "贴标机"
    type: packaging
    section: LB
    model: "LB-54000"
    spec: "54000B/H, 定位精度±1mm"
    quantity: 1
    supplier: "进口"
    power_kw: 5.5
    is_inverter: true
    sensors:
      - code: "ST"
        name: "贴标机速度"
        type: "编码器"
        range: [0, 60000]
        unit: "瓶/h"
        note: "与灌装同步"
      - code: "MT"
        name: "贴标机电机温度"
        type: "温度计"
        range: [0, 120]
        unit: "℃"
        alarm: {H: 100}
      - code: "PT"
        name: "标签纸剩余量"
        type: "液位计"
        alarm: {L: 10}
    motors:
      - id: "M-LB01"
        name: "贴标机"
        power_kw: 5.5
        is_inverter: true

  - id: "LB-102"
    name: "标签检测系统"
    type: packaging
    section: LB
    model: "LVS-100"
    spec: "标签位置检测"
    quantity: 1
    supplier: "进口"
    sensors:
      - code: "DT"
        name: "标签检测状态"
        type: "状态"
        alarm_action: "标签缺失报警"

devices_ca:
  - id: "CA-101"
    name: "纸箱成型机"
    type: packaging
    section: CA
    model: "CM-30"
    spec: "30箱/分钟"
    quantity: 1
    supplier: "国产"
    power_kw: 4.0
    is_inverter: true
    sensors:
      - code: "FT"
        name: "纸箱供应计数"
        type: "计数"
        unit: "个"
      - code: "DT"
        name: "纸箱成型状态"
        type: "状态"
    motors:
      - id: "M-CA01"
        name: "纸箱成型机"
        power_kw: 4.0
        is_inverter: true

  - id: "CA-102"
    name: "装箱机"
    type: packaging
    section: CA
    model: "MC-30"
    spec: "24瓶/箱, 30箱/分钟"
    quantity: 1
    supplier: "国产"
    power_kw: 5.5
    is_inverter: true
    sensors:
      - code: "FT"
        name: "装箱速度"
        type: "计数"
        range: [0, 60]
        unit: "箱/min"
        alarm: {L: 25, H: 40}
        note: "30箱/分钟额定"
      - code: "CT"
        name: "装箱计数"
        type: "计数"
        unit: "箱"
    motors:
      - id: "M-CA02"
        name: "装箱机"
        power_kw: 5.5
        is_inverter: true

  - id: "CA-103"
    name: "重量检测机"
    type: packaging
    section: CA
    model: "GC-30"
    spec: "精度±5g, 速度30箱/分钟"
    quantity: 1
    supplier: "国产"
    sensors:
      - code: "DT"
        name: "重量检测机状态"
        type: "状态"
        alarm_action: "超差报警"
        note: "±5g"
      - code: "WT"
        name: "实际重量"
        type: "重量计"
        range: [0, 30]
        unit: "kg"
