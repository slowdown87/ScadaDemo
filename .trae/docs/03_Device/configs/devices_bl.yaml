  - id: "BL-106"
    name: "香料/辅料罐"
    type: tank
    section: BL
    model: "SS304, 0.2m³"
    spec: "小型搅拌罐"
    quantity: 2
    supplier: "国产"
    sensors: []

  - id: "BL-107"
    name: "电子秤"
    type: sensor
    section: BL
    model: "ICS-500"
    spec: "精度0.1kg, 称量500kg"
    quantity: 1
    supplier: "国产"
    sensors:
      - code: "WT"
        name: "实际重量"
        type: "重量计"
        range: [0, 500]
        unit: "kg"
        alarm: {H: 500}

  - id: "BL-108"
    name: "调配液输送泵"
    type: pump
    section: BL
    model: "卫生级离心泵"
    spec: "3m³/h, SS316"
    quantity: 2
    supplier: "国产"
    power_kw: 3.0
    is_inverter: false
    control: "均质连锁"
